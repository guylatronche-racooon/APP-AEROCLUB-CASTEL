  <style>:root {
  --ink: #172a33;
  --muted: #667982;
  --teal-950: #062f3d;
  --teal-900: #073b4c;
  --teal-700: #087564;
  --sky: #149bd2;
  --sky-soft: #eaf7fc;
  --paper: #fcfdfd;
  --canvas: #eef3f5;
  --line: #d8e1e5;
  --yellow: #f5c542;
  --yellow-soft: #fff7d5;
  --red: #c64545;
}

* { box-sizing: border-box; }
html { background: var(--canvas); scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button { color: inherit; font: inherit; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
button, input { font: inherit; }

.cover-topbar, .module-topbar {
  align-items: center;
  background: rgba(252, 253, 253, .92);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  min-height: 76px;
  padding: 10px 28px;
}
.club-brand, .module-brand {
  align-items: center;
  display: flex;
  gap: 12px;
}
.club-brand img, .module-brand img {
  border-radius: 50%;
  height: 50px;
  object-fit: cover;
  width: 50px;
}
.club-brand strong, .module-brand strong { display: block; font-size: 15px; }
.club-brand small, .module-brand small {
  color: var(--muted);
  display: block;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .13em;
  margin-top: 2px;
  text-transform: uppercase;
}
.cover-actions, .module-actions { align-items: center; display: flex; gap: 9px; }
.cover-actions button, .module-actions button {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 750;
  min-height: 40px;
  padding: 0 14px;
}
.cover-actions button:hover, .module-actions button:hover { background: var(--sky-soft); border-color: #a4d9ea; }

.cover {
  margin: 0 auto;
  max-width: 1120px;
  padding: 64px 24px 40px;
}
.cover-intro {
  align-items: center;
  display: grid;
  gap: 34px;
  grid-template-columns: 154px minmax(0, 1fr);
  max-width: 860px;
}
.cover-logo {
  align-items: center;
  background: #fff;
  border: 1px solid #dce4e7;
  border-radius: 50%;
  box-shadow: 0 16px 38px rgba(9, 48, 63, .12);
  display: flex;
  height: 154px;
  justify-content: center;
  overflow: hidden;
  width: 154px;
}
.cover-logo img { height: 100%; object-fit: cover; width: 100%; }
.eyebrow {
  color: var(--sky);
  display: block;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.cover-intro h1 {
  font-size: clamp(43px, 7vw, 76px);
  letter-spacing: -.065em;
  line-height: .95;
  margin: 10px 0 16px;
}
.cover-intro p {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.55;
  margin: 0;
  max-width: 690px;
}
.fleet-heading {
  align-items: flex-end;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  margin-top: 58px;
  padding-top: 26px;
}
.fleet-heading span {
  color: var(--teal-700);
  display: block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.fleet-heading h2 { font-size: 27px; margin: 4px 0 0; }
.fleet-heading small { color: var(--muted); font-size: 12px; font-weight: 700; }
.aircraft-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  margin-top: 18px;
}
.aircraft-card {
  align-items: center;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(20, 50, 60, .055);
  cursor: pointer;
  display: grid;
  gap: 18px;
  grid-template-columns: 76px 1fr 40px;
  min-height: 142px;
  padding: 20px;
  text-align: left;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.aircraft-card:hover {
  border-color: #92cada;
  box-shadow: 0 15px 34px rgba(20, 70, 90, .11);
  transform: translateY(-2px);
}
.aircraft-number {
  align-items: center;
  background: linear-gradient(145deg, var(--teal-950), #075d72);
  border-radius: 12px;
  color: #fff;
  display: flex;
  font-size: 25px;
  font-weight: 900;
  height: 76px;
  justify-content: center;
  letter-spacing: -.03em;
  width: 76px;
}
.aircraft-copy { display: block; min-width: 0; }
.aircraft-copy > small { color: var(--muted); display: block; font-size: 11px; font-weight: 700; }
.aircraft-copy > strong { display: block; font-size: 29px; letter-spacing: -.035em; margin: 5px 0 10px; }
.aircraft-copy > span {
  align-items: center;
  color: var(--teal-700);
  display: flex;
  flex-wrap: wrap;
  font-size: 11px;
  font-weight: 750;
  gap: 7px;
}
.aircraft-copy > span i { background: #aebbc0; border-radius: 50%; height: 3px; width: 3px; }
.card-arrow {
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--sky);
  display: flex;
  font-size: 20px;
  height: 40px;
  justify-content: center;
  width: 40px;
}
.cover-notice {
  align-items: center;
  background: var(--yellow-soft);
  border: 1px solid #e8d17b;
  border-radius: 11px;
  display: grid;
  gap: 8px 16px;
  grid-template-columns: auto 1fr auto;
  margin-top: 22px;
  padding: 14px 16px;
}
.cover-notice strong { color: #5d4c0f; font-size: 12px; text-transform: uppercase; }
.cover-notice p { color: #67571c; font-size: 12px; margin: 0; }
.cover-notice button {
  background: transparent;
  border: 0;
  color: #755e08;
  cursor: pointer;
  font-size: 11px;
  font-weight: 850;
  text-decoration: underline;
}

.module-topbar { position: sticky; top: 0; z-index: 30; }
.module-brand {
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0;
  text-align: left;
}
.aircraft-hub { margin: 0 auto; max-width: 1120px; padding: 34px 24px 60px; }
.text-back {
  background: transparent;
  border: 0;
  color: var(--sky);
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  padding: 0;
}

.documents-block li { break-inside: avoid; color: var(--muted); font-size: 10px; line-height: 1.45; margin-bottom: 5px; }
.disclaimer > p:not(.disclaimer-lead) { color: var(--muted); font-size: 10px; line-height: 1.55; }
.disclaimer-final {
  background: var(--yellow-soft);
  border: 1px solid #e8d17b;
  border-radius: 9px;
  color: #5d4c0f;
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 12px 14px;
}
.disclaimer-final strong { font-size: 11px; }
.disclaimer-final span { font-size: 10px; }
.accept-button {
  background: linear-gradient(115deg, var(--teal-950), #07556a);
  border: 0;
  border-radius: 9px;
  color: #fff;

  font-size: 13px;
  font-weight: 850;
  margin-top: 18px;
  min-height: 52px;
  padding: 0 22px;
  width: 100%;
}

.overlay {
  align-items: stretch;
  backdrop-filter: blur(3px);
  background: rgba(3, 25, 33, .55);
  display: flex;
  inset: 0;
  justify-content: flex-end;
  position: fixed;
  z-index: 100;
}
.drawer {
  background: var(--paper);
  box-shadow: -18px 0 50px rgba(3, 25, 33, .22);
  height: 100%;
  max-width: 440px;
  overflow: auto;
  padding: 26px;
  width: 100%;
}
.drawer-header { align-items: flex-start; display: flex; justify-content: space-between; }
.drawer-header span { color: var(--sky); font-size: 12px; font-weight: 800; }
.drawer-header h2 { font-size: 28px; margin: 3px 0 0; }
.drawer-header button {
  align-items: center;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  font-size: 26px;
  height: 42px;
  justify-content: center;
  width: 42px;
}
.quick-facts { margin: 30px 0; }
.quick-facts div { align-items: center; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; min-height: 55px; }
.quick-facts dt { color: var(--muted); font-size: 14px; }
.quick-facts dd { font-size: 15px; font-weight: 850; }
.drawer-warning {
  background: var(--yellow-soft);
  border: 1px solid #ead782;
  border-radius: 9px;
  color: #5b4b13;
  font-size: 12px;
  line-height: 1.6;
  padding: 14px;
}
.phase-overlay { align-items: flex-end; justify-content: stretch; }
.phase-sheet {

  padding: 20px 16px calc(24px + env(safe-area-inset-bottom));
  width: 100%;
}
.phase-sheet nav { display: flex; flex-direction: column; margin-top: 14px; }

  align-items: center;
  background: transparent;
  border: 0;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 12px;
  grid-template-columns: 34px 1fr auto;
  min-height: 54px;
  padding: 6px;
  text-align: left;
}
.phase-sheet nav button > span {
  align-items: center;
  border: 1px solid #aebbc0;
  border-radius: 50%;
  display: flex;
  font-size: 11px;
  font-weight: 800;
  height: 28px;
  justify-content: center;
  width: 28px;

.phase-sheet nav button.active { color: var(--sky); }

.night {

.night .aircraft-card, .night .module-card,

.night .load-inputs input { color: #eaf5fb; }
.night .load-inputs b { color: #a8c5d5; }

  function pointOnSegment(point, start, end) {
    const px = point[0], py = point[1], ax = start[0], ay = start[1], bx = end[0], by = end[1];
    const cross = (px - ax) * (by - ay) - (py - ay) * (bx - ax);
    if (Math.abs(cross) > 0.0001) return false;
    const dot = (px - ax) * (bx - ax) + (py - ay) * (by - ay);
    if (dot < 0) return false;
    return dot <= (bx - ax) ** 2 + (by - ay) ** 2;
  }

  function pointInEnvelope(point, envelope) {
    for (let index = 0; index < envelope.length; index += 1) {
      if (pointOnSegment(point, envelope[index], envelope[(index + 1) % envelope.length])) return true;
    }
    let inside = false;
    for (let index = 0, previous = envelope.length - 1; index < envelope.length; previous = index, index += 1) {
      const xi = envelope[index][0], yi = envelope[index][1];
      const xj = envelope[previous][0], yj = envelope[previous][1];
      const intersects = yi > point[1] !== yj > point[1] && point[0] < ((xj - xi) * (point[1] - yi)) / (yj - yi) + xi;
      if (intersects) inside = !inside;
    }
    return inside;
  }

      '<div class="aircraft-identity"><div class="registration-stamp">' + escapeHtml(aircraft.registration) + '</div><div><span class="eyebrow">' + escapeHtml(aircraft.type) + '</span><h1>' + escapeHtml(aircraft.name) + '</h1><p>Choisir l’outil à utiliser pour cet appareil.</p></div></div>' +
      '<div class="module-grid"><button class="module-card checklist-module" data-action="screen" data-screen="checklist"' + (checklist ? '' : ' disabled') + '>' +
      '<span class="module-index">01</span><span class="module-symbol">✓</span><span class="module-copy"><small>' + (checklist ? 'Fiche propre à l’avion' : 'Document requis') + '</small><strong>Check-list</strong><p>' + escapeHtml(checklistText) + '</p></span><span class="module-cta">' + (checklist ? 'Ouvrir →' : 'À venir') + '</span></button>' +
      '<button class="module-card balance-module" data-action="screen" data-screen="balance"><span class="module-index">02</span><span class="module-symbol">⚖</span><span class="module-copy"><small>Calcul repris des fichiers transmis</small><strong>Masse & centrage</strong><p>Renseigner les occupants, les bagages et le carburant, puis contrôler le point dans l’enveloppe.</p></span><span class="module-cta">Calculer →</span></button></div>' +
      '<div class="aircraft-data-strip"><div><span>Masse maximale</span><strong>' + formatFr(balance.maxMass, 0) + ' kg</strong></div><div><span>Masse à vide</span><strong>' + formatFr(balance.emptyMass, 1) + ' kg</strong></div><div><span>Carburant calculé</span><strong>' + formatFr(balance.fuelDensity, 2) + ' kg/l</strong></div><div><span>Motorisation</span><strong>' + escapeHtml(balance.engine) + '</strong></div></div>' +
      '<div class="validation-note"><strong>Version à valider par le club</strong><span>' + escapeHtml(!checklist ? 'La check-list ' + aircraft.registration + ' n’a pas encore été fournie.' : checklist.partial ? 'La partie reçue a été transcrite ; les autres sections restent à fournir.' : 'La check-list F-HDLT contient encore trois lignes signalées « à confirmer ».') + '</span></div>' +
      '</section>' + footerNote() + '</main>';
  }

  function checklistView() {
    const aircraft = currentAircraft();
    const checklist = aircraft.checklist;
    if (!checklist) { state.screen = 'aircraft'; return aircraftView(); }
    const phases = checklist.phases;
    state.phaseIndex = Math.max(0, Math.min(state.phaseIndex, phases.length - 1));
    const phase = phases[state.phaseIndex];
    const aircraftChecked = state.checked[aircraft.id] || {};
    const count = phase.items.filter(function(_, index) { return aircraftChecked[itemKey(phase, index)]; }).length;
    const percent = Math.round((count / phase.items.length) * 100);
    const totalItems = phases.reduce(function(sum, candidate) { return sum + candidate.items.length; }, 0);
    const totalDone = phases.reduce(function(sum, candidate) { return sum + candidate.items.filter(function(_, index) { return aircraftChecked[itemKey(candidate, index)]; }).length; }, 0);
    const overall = Math.round((totalDone / totalItems) * 100);
    const phaseNav = phases.map(function(candidate, index) {
      const completed = candidate.items.every(function(_, itemIndex) { return aircraftChecked[itemKey(candidate, itemIndex)]; });
      return '<button class="' + (candidate.id === phase.id ? 'active ' : '') + (candidate.warning ? 'warning' : '') + '" data-action="phase" data-index="' + index + '"><span class="phase-icon">' + (completed ? '✓' : index + 1) + '</span><span>' + escapeHtml(candidate.short) + '</span></button>';
    }).join('');
    const rows = phase.items.map(function(item, index) {
      const key = itemKey(phase, index), done = Boolean(aircraftChecked[key]);
      return '<button class="check-row ' + (done ? 'done ' : '') + (item.critical ? 'critical ' : '') + (item.verify ? 'verify' : '') + '" data-action="check" data-index="' + index + '" aria-pressed="' + done + '">' +
        '<span class="check-box">' + (done ? '✓' : '') + '</span><span class="item-number">' + (index + 1) + '</span><span class="item-copy"><strong>' + escapeHtml(item.action) + '</strong>' + (item.note ? '<small>' + escapeHtml(item.note) + '</small>' : '') + '</span><span class="dots"></span><span class="response">' + escapeHtml(item.response) + (item.verify ? '<small>À confirmer</small>' : '') + '</span></button>';
    }).join('');
    const facts = checklist.quickFacts || [];
    return '<main class="' + appClass() + '">' + header('FLIGHT CHECK', aircraft.name, 'aircraft', '<button class="desktop-only" data-action="screen" data-screen="balance">Masse & centrage</button><button class="desktop-only" data-action="facts">Repères</button>') +
      '<div class="validation-banner"><strong>VERSION À VALIDER</strong><span>' + escapeHtml(checklist.partial ? 'Partie reçue transcrite — cette check-list est incomplète et doit être complétée puis validée par le club.' : 'Prototype soumis au contrôle du club — ne remplace pas la check-list approuvée ni le manuel de vol.') + '</span></div>' +
      '<div class="mobile-phasebar"><button data-action="phases"><span>Phase ' + (state.phaseIndex + 1) + '/' + phases.length + '</span><strong>' + escapeHtml(phase.title) + '</strong><b>⌄</b></button><div class="overall-mini"><span>Vol</span><strong>' + overall + '%</strong></div></div>' +
      '<div class="shell"><aside class="phase-rail"><div class="rail-heading"><span>Phases de vol</span><strong>' + overall + '%</strong></div><div class="overall-track"><i style="width:' + overall + '%"></i></div><nav>' + phaseNav + '</nav></aside>' +
      '<section class="checklist-panel"><div class="section-kicker"><span>' + (phase.warning ? 'PROCÉDURE PARTICULIÈRE' : 'CHECK-LIST NORMALE') + '</span><button data-action="reset-checklist">Réinitialiser</button></div>' +
      '<div class="phase-title-row"><div><h1>' + escapeHtml(phase.title) + '</h1><p>' + count + ' / ' + phase.items.length + ' éléments confirmés</p></div><strong>' + percent + '%</strong></div><div class="progress-track"><i style="width:' + percent + '%"></i></div><div class="checklist">' + rows + '</div>' +
      '<div class="navigation-actions"><button class="secondary" data-action="phase" data-index="' + (state.phaseIndex - 1) + '"' + (state.phaseIndex === 0 ? ' disabled' : '') + '>← Précédent</button><button class="primary" data-action="phase" data-index="' + (state.phaseIndex + 1) + '"' + (state.phaseIndex === phases.length - 1 ? ' disabled' : '') + '>' + (count === phase.items.length ? 'Phase validée' : 'Continuer') + ' →</button></div></section>' +
      '<aside class="facts-rail"><div class="fact-card accent"><div class="card-heading"><strong>Repères immédiats</strong><button data-action="facts">Tous</button></div><dl>' + facts.slice(0,4).map(function(fact, index) { return '<div class="' + (index === 2 ? 'highlight' : '') + '"><dt>' + escapeHtml(fact[0]) + '</dt><dd>' + escapeHtml(fact[1]) + '</dd></div>'; }).join('') + '</dl></div><div class="fact-card safety"><strong>Sécurité</strong><p>Aide-mémoire transcrit depuis la fiche ' + escapeHtml(aircraft.registration) + '. Le manuel de vol et la check-list approuvée demeurent les références.</p></div><div class="fact-card source"><span>Source</span><strong>' + escapeHtml(checklist.source) + '</strong><small>' + escapeHtml(checklist.sourceNote) + '</small></div></aside></div>' +
      '<footer class="mobile-footer"><button data-action="screen" data-screen="aircraft">⌂</button><button class="mobile-primary" data-action="phase" data-index="' + (state.phaseIndex + 1) + '"' + (state.phaseIndex === phases.length - 1 ? ' disabled' : '') + '>' + count + '/' + phase.items.length + ' · Continuer</button><button data-action="facts">i</button></footer>' + footerNote() + '</main>';
  }

  function balanceResult(aircraft) {
    const balance = aircraft.balance;
    const load = Object.assign({}, defaultLoad(balance), state.loads[aircraft.id] || {});
    const rows = [{label:'Masse à vide', mass:balance.emptyMass, arm:balance.emptyArm, moment:balance.emptyMass * balance.emptyArm}];
    balance.inputs.forEach(function(input) {
      const raw = Number(load[input.key]);
      const value = Number.isFinite(raw) && raw >= 0 ? raw : 0;
      const mass = value * (input.massFactor || 1);
      rows.push({label:input.rowLabel, mass:mass, arm:input.arm, moment:mass * input.arm});
    });
    const totalMass = rows.reduce(function(sum,row){ return sum + row.mass; },0);
    const totalMoment = rows.reduce(function(sum,row){ return sum + row.moment; },0);
    const cg = totalMoment / totalMass;
    const safe = totalMass <= balance.maxMass && pointInEnvelope([cg,totalMass], balance.envelope);
    return {balance:balance, load:load, rows:rows, totalMass:totalMass, totalMoment:totalMoment, cg:cg, safe:safe, margin:balance.maxMass-totalMass};
  }

  function chart(result) {
    const config = result.balance, c = config.chart, width = 680, height = 430;
    const p = {top:28,right:26,bottom:58,left:68}, plotW = width-p.left-p.right, plotH=height-p.top-p.bottom;
    const x = function(value){ return p.left + ((value-c.xMin)/(c.xMax-c.xMin))*plotW; };
    const y = function(value){ return p.top + ((c.yMax-value)/(c.yMax-c.yMin))*plotH; };
    const clamp = function(value,min,max){ return Math.min(max,Math.max(min,value)); };
    const xTicks=[], yTicks=[];
    for(let value=c.xMin; value<=c.xMax+0.00001; value+=c.xStep) xTicks.push(value);
    for(let value=c.yMin; value<=c.yMax+0.00001; value+=c.yStep) yTicks.push(value);
    const polygon = config.envelope.map(function(point){ return x(point[0])+','+y(point[1]); }).join(' ');
    const px=x(clamp(result.cg,c.xMin,c.xMax)), py=y(clamp(result.totalMass,c.yMin,c.yMax));
    const clamped=result.cg<c.xMin||result.cg>c.xMax||result.totalMass<c.yMin||result.totalMass>c.yMax;
    return '<div class="balance-chart"><svg viewBox="0 0 '+width+' '+height+'" role="img" aria-label="Enveloppe de centrage">' +
      '<rect class="chart-plot" x="'+p.left+'" y="'+p.top+'" width="'+plotW+'" height="'+plotH+'"></rect>' +
      xTicks.map(function(t){return '<line class="chart-grid" x1="'+x(t)+'" x2="'+x(t)+'" y1="'+p.top+'" y2="'+(p.top+plotH)+'"></line><text class="chart-tick" x="'+x(t)+'" y="'+(height-34)+'">'+t.toFixed(2)+'</text>';}).join('') +
      yTicks.map(function(t){return '<line class="chart-grid" x1="'+p.left+'" x2="'+(p.left+plotW)+'" y1="'+y(t)+'" y2="'+y(t)+'"></line><text class="chart-tick chart-tick-y" x="'+(p.left-9)+'" y="'+(y(t)+4)+'">'+Math.round(t)+'</text>';}).join('') +
      '<polygon class="envelope-area" points="'+polygon+'"></polygon><circle class="load-ring '+(result.safe?'safe':'unsafe')+'" cx="'+px+'" cy="'+py+'" r="13"></circle><circle class="load-point '+(result.safe?'safe':'unsafe')+'" cx="'+px+'" cy="'+py+'" r="7"></circle>' +
      '<text class="chart-axis-title" x="'+(p.left+plotW/2)+'" y="'+(height-7)+'">Centre de gravité (m)</text><text class="chart-axis-title" transform="translate(15 '+(p.top+plotH/2)+') rotate(-90)">Masse (kg)</text>' +
      (clamped?'<text class="chart-clamped-note" x="'+(width-p.right)+'" y="18">Point ramené au bord du graphique</text>':'') + '</svg><div class="chart-legend"><span><i class="legend-envelope"></i>Enveloppe</span><span><i class="legend-point '+(result.safe?'safe':'unsafe')+'"></i>Chargement calculé</span></div></div>';
  }

  function balanceView() {
    const aircraft=currentAircraft(), result=balanceResult(aircraft), balance=result.balance;
    const inputs=balance.inputs.map(function(input){
      const value=result.load[input.key] == null ? input.defaultValue : result.load[input.key];
      const mass=Number(value)*(input.massFactor||1);
      return '<label><span>'+escapeHtml(input.label)+'</span><div><input data-load="'+input.key+'" inputmode="decimal" type="number" min="0" max="'+(input.max||999)+'" step="'+(input.step||0.5)+'" value="'+value+'"><b>'+escapeHtml(input.unit)+'</b></div>' + ((input.note||input.unit==='litres')?'<small>'+(input.unit==='litres'?formatFr(mass,1)+' kg':'')+(input.unit==='litres'&&input.note?' · ':'')+escapeHtml(input.note||'')+'</small>':'')+'</label>';
    }).join('');
    const tableRows=result.rows.map(function(row){return '<tr><td>'+escapeHtml(row.label)+'</td><td>'+formatFr(row.mass,1)+' kg</td><td>'+formatFr(row.arm,4)+' m</td><td>'+formatFr(row.moment,2)+'</td></tr>';}).join('');
    let statusCopy = result.totalMass>balance.maxMass ? 'Masse maximale dépassée de '+formatFr(Math.abs(result.margin),1)+' kg.' : result.totalMass<balance.chart.yMin ? 'La masse calculée est sous la limite inférieure représentée par l’enveloppe.' : 'Le point calculé est en dehors des limites de centrage représentées.';
    return '<main class="'+appClass()+'">'+header('MASSE & CENTRAGE',aircraft.name,'aircraft',(aircraft.checklist?'<button class="desktop-only" data-action="screen" data-screen="checklist">Check-list</button>':'')+'<button class="desktop-only" data-action="documents">Documents</button>')+
      '<div class="validation-banner"><strong>VERSION À VALIDER</strong><span>'+escapeHtml(balance.source)+'</span></div><div class="balance-shell"><section class="load-panel"><div class="balance-heading"><div><span class="eyebrow">Chargement au départ</span><h1>Masse & centrage</h1></div><button data-action="reset-load">Valeurs Excel</button></div><p class="balance-lead">'+escapeHtml(balance.lead)+'</p><div class="load-inputs">'+inputs+'</div>'+
      '<div class="calculation-table-wrap"><table class="calculation-table"><thead><tr><th>Élément</th><th>Masse</th><th>Bras</th><th>Moment</th></tr></thead><tbody>'+tableRows+'</tbody><tfoot><tr><th>Total</th><th>'+formatFr(result.totalMass,1)+' kg</th><th>'+formatFr(result.cg,4)+' m</th><th>'+formatFr(result.totalMoment,2)+'</th></tr></tfoot></table></div><div class="source-note"><strong>Hypothèses reprises du fichier</strong><span>'+escapeHtml(balance.assumptions)+'</span></div></section>'+
      '<section class="result-panel"><div class="load-status '+(result.safe?'safe':'unsafe')+'"><span>'+(result.safe?'✓':'!')+'</span><div><small>Résultat</small><strong>'+(result.safe?'Dans l’enveloppe':'Hors enveloppe')+'</strong><p>'+escapeHtml(result.safe?'Marge de masse : '+formatFr(result.margin,1)+' kg.':statusCopy)+'</p></div></div><div class="metric-grid"><div><span>Masse totale</span><strong>'+formatFr(result.totalMass,1)+' <small>kg</small></strong></div><div><span>Centre de gravité</span><strong>'+formatFr(result.cg,4)+' <small>m</small></strong></div><div class="'+(result.margin<0?'alert':'')+'"><span>Marge masse</span><strong>'+formatFr(result.margin,1)+' <small>kg</small></strong></div></div>'+chart(result)+'<div class="balance-warning"><strong>Contrôle obligatoire</strong><p>Ce calcul ne contrôle pas toutes les limitations propres à l’aéronef, notamment une éventuelle limitation de soute ou une fiche de pesée plus récente. Vérifier le manuel de vol et la fiche de pesée en vigueur.</p></div></section></div>'+
      '<footer class="tool-mobile-footer"><button data-action="screen" data-screen="aircraft">← Avion</button>'+(aircraft.checklist?'<button data-action="screen" data-screen="checklist">Check-list</button>':'')+'<button data-action="documents">Documents</button></footer>'+footerNote()+'</main>';
  }

  function footerNote() {
    return '<p class="app-footer-note">Prototype de l’Aéroclub Jean-Doudiès — version à valider. La documentation approuvée de l’aéronef et les consignes du club font foi.</p>';
  }

  function disclaimer() {
    if (!state.showDisclaimer) return '';
    return '<div class="overlay disclaimer-overlay"><section class="disclaimer" role="dialog" aria-modal="true" aria-labelledby="disclaimer-title"><div class="disclaimer-header"><div><span>Avant utilisation</span><h2 id="disclaimer-title">Documentation et responsabilité du pilote</h2></div>'+logoImage('')+'</div>'+
      '<p class="disclaimer-lead">Cette application constitue uniquement une aide à l’exécution des check-lists et au calcul de masse et centrage. Elle ne remplace ni le manuel de vol, ni les procédures approuvées, ni la préparation réglementaire du vol.</p><div class="documents-block"><strong>Avant chaque vol, vérifier la présence, l’accessibilité et, lorsqu’une durée s’applique, la validité des documents et informations requis.</strong><p>Liste indicative et non exhaustive :</p><ul><li>manuel de vol de l’aéronef ou document équivalent ;</li><li>certificat d’immatriculation original ;</li><li>certificat de navigabilité original ou titre applicable ;</li><li>certificat acoustique, liste des agréments spécifiques et licence de station d’aéronef, si applicables ;</li><li>attestation d’assurance responsabilité civile ;</li><li>carnet de route ou document équivalent ;</li><li>plan de vol ATS, si applicable ;</li><li>cartes aéronautiques à jour pour le trajet et les déroutements raisonnablement envisageables ;</li><li>procédures et signaux visuels applicables en cas d’interception ;</li><li>MEL ou CDL, si applicable ;</li><li>licence, qualifications, expérience récente et certificat médical du pilote en cours de validité ;</li><li>toute autre autorisation ou documentation exigée par le vol ou les États concernés.</li></ul></div>'+
      '<p>Pour certains vols décollant et atterrissant sur le même aérodrome, ou restant dans une zone déterminée, certains documents peuvent être conservés à l’aérodrome. Ils doivent néanmoins exister, être valides et pouvoir être présentés dans un délai raisonnable.</p><div class="disclaimer-final"><strong>La réglementation en vigueur, la documentation approuvée de l’aéronef et les consignes de l’aéroclub font foi.</strong><span>Le commandant de bord demeure responsable de la préparation, de la décision et de la conduite du vol.</span></div><button class="accept-button" data-action="accept-disclaimer">'+(localStorage.getItem(DISCLAIMER_KEY)==='accepted'?'Fermer':'J’ai compris — accéder à l’application')+'</button></section></div>';
  }

  function factsOverlay() {
    if (!state.showFacts) return '';
    const aircraft=currentAircraft(), facts=aircraft.checklist ? aircraft.checklist.quickFacts : [];
    return '<div class="overlay" data-action="close-overlay"><section class="drawer" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="drawer-header"><div><span>'+escapeHtml(aircraft.registration)+' · '+escapeHtml(aircraft.name)+'</span><h2>Repères avion</h2></div><button data-action="facts">×</button></div><dl class="quick-facts">'+facts.map(function(f){return '<div><dt>'+escapeHtml(f[0])+'</dt><dd>'+escapeHtml(f[1])+'</dd></div>';}).join('')+'</dl><div class="drawer-warning">Ces valeurs sont retranscrites depuis la fiche photographiée. Vérifier leur validité avec la documentation approuvée avant utilisation en vol.</div></section></div>';
  }

  function phasesOverlay() {
    if (!state.showPhases) return '';
    const aircraft=currentAircraft(), phases=aircraft.checklist.phases, checked=state.checked[aircraft.id]||{};
    return '<div class="overlay phase-overlay" data-action="close-overlay"><section class="phase-sheet" role="dialog" aria-modal="true" onclick="event.stopPropagation()"><div class="drawer-header"><h2>Phases de vol</h2><button data-action="phases">×</button></div><nav>'+phases.map(function(phase,index){const count=phase.items.filter(function(_,itemIndex){return checked[itemKey(phase,itemIndex)];}).length;return '<button class="'+(index===state.phaseIndex?'active':'')+'" data-action="phase" data-index="'+index+'"><span>'+(index+1)+'</span><strong>'+escapeHtml(phase.title)+'</strong><small>'+count+'/'+phase.items.length+'</small></button>';}).join('')+'</nav></section></div>';
  }

  function render() {
    const app=document.getElementById('app');
    let view=state.screen==='home'?homeView():state.screen==='aircraft'?aircraftView():state.screen==='balance'?balanceView():checklistView();
    app.innerHTML=view+factsOverlay()+phasesOverlay()+disclaimer();
    document.documentElement.style.background=state.night?'#071219':'#eef3f5';
  }

  function persist() {
    localStorage.setItem(STORAGE_KEY,JSON.stringify(state.checked));
    localStorage.setItem(LOAD_STORAGE_KEY,JSON.stringify(state.loads));
    localStorage.setItem(THEME_KEY,state.night?'night':'day');
  }

  document.addEventListener('click',function(event){
    const button=event.target.closest('[data-action]');
    if(!button||button.disabled)return;
    const action=button.dataset.action;
    if(action==='select-aircraft'){state.aircraftId=button.dataset.aircraft;state.phaseIndex=0;state.screen='aircraft';state.showFacts=false;state.showPhases=false;scrollTo(0,0);}
    if(action==='screen'){state.screen=button.dataset.screen;state.showFacts=false;state.showPhases=false;scrollTo(0,0);}
    if(action==='theme'){state.night=!state.night;persist();}
    if(action==='documents'){state.showDisclaimer=true;}
    if(action==='accept-disclaimer'){state.showDisclaimer=false;localStorage.setItem(DISCLAIMER_KEY,'accepted');}
    if(action==='facts'){state.showFacts=!state.showFacts;}
    if(action==='phases'){state.showPhases=!state.showPhases;}
    if(action==='close-overlay'){state.showFacts=false;state.showPhases=false;}
    if(action==='phase'){const aircraft=currentAircraft();const max=aircraft.checklist.phases.length-1;state.phaseIndex=Math.max(0,Math.min(Number(button.dataset.index),max));state.showPhases=false;scrollTo(0,0);}
    if(action==='check'){const aircraft=currentAircraft(),phase=aircraft.checklist.phases[state.phaseIndex],key=itemKey(phase,Number(button.dataset.index));state.checked[aircraft.id]=state.checked[aircraft.id]||{};state.checked[aircraft.id][key]=!state.checked[aircraft.id][key];persist();}
    if(action==='reset-checklist'){if(confirm('Réinitialiser toute la progression de cette check-list ?')){state.checked[currentAircraft().id]={};persist();}}
    if(action==='reset-load'){state.loads[currentAircraft().id]=defaultLoad(currentAircraft().balance);persist();}
    render();
  });

  document.addEventListener('change',function(event){
    const input=event.target.closest('[data-load]');
    if(!input)return;
    const value=Math.max(0,Number(input.value)||0), aircraft=currentAircraft();
    state.loads[aircraft.id]=Object.assign({},defaultLoad(aircraft.balance),state.loads[aircraft.id]||{});
    state.loads[aircraft.id][input.dataset.load]=value;
    persist();
    render();
    const replacement=document.querySelector('[data-load="'+input.dataset.load+'"]');
    if(replacement){replacement.focus();replacement.setSelectionRange&&replacement.setSelectionRange(String(value).length,String(value).length);}
  });

  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
  render();
  </script>
