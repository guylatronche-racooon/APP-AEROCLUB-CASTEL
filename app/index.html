<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#073b4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Outils de vol">
  <meta name="description" content="Check-lists, masse et centrage, altitude-densité, météo et performances de décollage pour les pilotes de l’Aéroclub Jean-Doudiès.">
  <title>Outils de vol — Aéroclub Jean-Doudiès</title>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <style>:root {
  --ink: #172a33;
  --muted: #667982;
  --teal-950: #062f3d;
  --teal-900: #073b4c;
  --teal-700: #087564;
  --sky: #149bd2;
  --sky-soft: #eaf7fc;
  --paper: #fcfdfd;
  --canvas: #eef3f5;
  --line: #d8e1e5;
  --yellow: #f5c542;
  --yellow-soft: #fff7d5;
  --red: #c64545;
}

* { box-sizing: border-box; }
html { background: var(--canvas); scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--canvas);
  color: var(--ink);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
button { color: inherit; font: inherit; }
button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
button, input { font: inherit; }

.cover-topbar, .module-topbar {
  align-items: center;
  background: rgba(252, 253, 253, .92);
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  min-height: calc(76px + env(safe-area-inset-top));
  padding: calc(10px + env(safe-area-inset-top)) 28px 10px;
}
.club-brand, .module-brand {
  align-items: center;
  display: flex;
  gap: 12px;
}
.club-brand img, .module-brand img {
  border-radius: 50%;
  height: 50px;
  object-fit: cover;
  width: 50px;
}
.club-brand strong, .module-brand strong { display: block; font-size: 15px; }
.club-brand small, .module-brand small {
  color: var(--muted);
  display: block;
  font-size: 10px;
  font-weight: 750;
  letter-spacing: .13em;
  margin-top: 2px;
  text-transform: uppercase;
}
.cover-actions, .module-actions { align-items: center; display: flex; gap: 9px; }
.cover-actions button, .module-actions button {
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 750;
  min-height: 40px;
  padding: 0 14px;
}
.cover-actions button:hover, .module-actions button:hover { background: var(--sky-soft); border-color: #a4d9ea; }

.cover {
  margin: 0 auto;
  max-width: 1120px;
  padding: 64px 24px 40px;
}
.cover-intro {
  align-items: center;
  display: grid;
  gap: 34px;
  grid-template-columns: 154px minmax(0, 1fr);
  max-width: 860px;
}
.cover-logo {
  align-items: center;
  background: #fff;
  border: 1px solid #dce4e7;
  border-radius: 50%;
  box-shadow: 0 16px 38px rgba(9, 48, 63, .12);
  display: flex;
  height: 154px;
  justify-content: center;
  overflow: hidden;
  width: 154px;
}
.cover-logo img { height: 100%; object-fit: cover; width: 100%; }
.eyebrow {
  color: var(--sky);
  display: block;
  font-size: 11px;
  font-weight: 850;
  letter-spacing: .14em;
  text-transform: uppercase;
}
.cover-intro h1 {
  font-size: clamp(43px, 7vw, 76px);
  letter-spacing: -.065em;
  line-height: .95;
  margin: 10px 0 16px;
}
.cover-intro p {
  color: var(--muted);
  font-size: 17px;
  line-height: 1.55;
  margin: 0;
  max-width: 690px;
}
.fleet-heading {
  align-items: flex-end;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  margin-top: 58px;
  padding-top: 26px;
}
.fleet-heading span {
  color: var(--teal-700);
  display: block;
  font-size: 10px;
  font-weight: 850;
  letter-spacing: .12em;
  text-transform: uppercase;
}
.fleet-heading h2 { font-size: 27px; margin: 4px 0 0; }
.fleet-heading small { color: var(--muted); font-size: 12px; font-weight: 700; }
.aircraft-grid {
  display: grid;
  gap: 16px;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  margin-top: 18px;
}
.aircraft-card {
  align-items: center;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 14px;
  box-shadow: 0 8px 24px rgba(20, 50, 60, .055);
  cursor: pointer;
  display: grid;
  gap: 18px;
  grid-template-columns: 76px 1fr 40px;
  min-height: 142px;
  padding: 20px;
  text-align: left;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.aircraft-card:hover {
  border-color: #92cada;
  box-shadow: 0 15px 34px rgba(20, 70, 90, .11);
  transform: translateY(-2px);
}
.aircraft-number {
  align-items: center;
  background: linear-gradient(145deg, var(--teal-950), #075d72);
  border-radius: 12px;
  color: #fff;
  display: flex;
  font-size: 25px;
  font-weight: 900;
  height: 76px;
  justify-content: center;
  letter-spacing: -.03em;
  width: 76px;
}
.aircraft-copy { display: block; min-width: 0; }
.aircraft-copy > small { color: var(--muted); display: block; font-size: 11px; font-weight: 700; }
.aircraft-copy > strong { display: block; font-size: 29px; letter-spacing: -.035em; margin: 5px 0 10px; }
.aircraft-copy > span {
  align-items: center;
  color: var(--teal-700);
  display: flex;
  flex-wrap: wrap;
  font-size: 11px;
  font-weight: 750;
  gap: 7px;
}
.aircraft-copy > span i { background: #aebbc0; border-radius: 50%; height: 3px; width: 3px; }
.card-arrow {
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  color: var(--sky);
  display: flex;
  font-size: 20px;
  height: 40px;
  justify-content: center;
  width: 40px;
}
.cover-notice {
  align-items: center;
  background: var(--yellow-soft);
  border: 1px solid #e8d17b;
  border-radius: 11px;
  display: grid;
  gap: 8px 16px;
  grid-template-columns: auto 1fr auto;
  margin-top: 22px;
  padding: 14px 16px;
}
.cover-notice strong { color: #5d4c0f; font-size: 12px; text-transform: uppercase; }
.cover-notice p { color: #67571c; font-size: 12px; margin: 0; }
.cover-notice button {
  background: transparent;
  border: 0;
  color: #755e08;
  cursor: pointer;
  font-size: 11px;
  font-weight: 850;
  text-decoration: underline;
}

.module-topbar { position: sticky; top: 0; z-index: 30; }
.module-brand {
  background: transparent;
  border: 0;
  cursor: pointer;
  padding: 0;
  text-align: left;
}
.aircraft-hub { margin: 0 auto; max-width: 1120px; padding: 34px 24px 60px; }
.text-back {
  background: transparent;
  border: 0;
  color: var(--sky);
  cursor: pointer;
  font-size: 12px;
  font-weight: 800;
  padding: 0;
}
.aircraft-identity {
  align-items: center;
  display: grid;
  gap: 26px;
  grid-template-columns: 148px 1fr;
  margin: 34px 0;
}
.registration-stamp {
  align-items: center;
  background: linear-gradient(145deg, var(--teal-950), #075d72);
  border-radius: 14px;
  box-shadow: 0 16px 32px rgba(6, 47, 61, .18);
  color: #fff;
  display: flex;
  font-size: 28px;
  font-weight: 900;
  height: 104px;
  justify-content: center;
  letter-spacing: -.035em;
}
.aircraft-identity h1 { font-size: clamp(44px, 7vw, 70px); letter-spacing: -.06em; line-height: .95; margin: 8px 0 10px; }
.aircraft-identity p { color: var(--muted); margin: 0; }
.module-grid { display: grid; gap: 18px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.module-card {
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 15px;
  cursor: pointer;
  display: grid;
  gap: 8px 18px;
  grid-template-columns: 56px 1fr auto;
  grid-template-rows: auto 1fr auto;
  min-height: 285px;
  overflow: hidden;
  padding: 24px;
  position: relative;
  text-align: left;
  transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
}
.module-card::after {
  background: linear-gradient(90deg, var(--teal-700), var(--sky));
  bottom: 0;
  content: "";
  height: 5px;
  left: 0;
  position: absolute;
  right: 0;
}
.module-card:hover:not(:disabled) {
  border-color: #8dc8dd;
  box-shadow: 0 16px 38px rgba(18, 67, 84, .11);
  transform: translateY(-2px);
}
.module-card.disabled { cursor: not-allowed; opacity: .56; }
.module-card.disabled::after { background: #aebbc0; }
.module-index { color: var(--muted); font-size: 11px; font-weight: 800; letter-spacing: .12em; }
.module-symbol {
  align-items: center;
  background: var(--sky-soft);
  border: 1px solid #adddeb;
  border-radius: 12px;
  color: var(--teal-700);
  display: flex;
  font-size: 26px;
  grid-column: 1;
  grid-row: 2;
  height: 56px;
  justify-content: center;
  width: 56px;
}
.module-copy { grid-column: 2 / span 2; grid-row: 2; }
.module-copy small { color: var(--sky); display: block; font-size: 11px; font-weight: 800; }
.module-copy strong { display: block; font-size: 29px; letter-spacing: -.04em; margin: 8px 0; }
.module-copy p { color: var(--muted); font-size: 13px; line-height: 1.55; margin: 0; max-width: 420px; }
.module-cta { align-self: end; color: var(--teal-700); font-size: 12px; font-weight: 850; grid-column: 2 / span 2; grid-row: 3; }
.aircraft-data-strip {
  background: var(--teal-950);
  border-radius: 13px;
  color: #fff;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  margin-top: 18px;
  overflow: hidden;
}
.aircraft-data-strip div { border-right: 1px solid rgba(255,255,255,.14); padding: 18px; }
.aircraft-data-strip div:last-child { border: 0; }
.aircraft-data-strip span { color: #abd4df; display: block; font-size: 10px; margin-bottom: 5px; }
.aircraft-data-strip strong { font-size: 14px; }
.validation-note {
  align-items: center;
  background: var(--yellow-soft);
  border: 1px solid #e8d17b;
  border-radius: 10px;
  color: #5d4c0f;
  display: flex;
  gap: 12px;
  margin-top: 16px;
  padding: 12px 14px;
}
.validation-note strong { font-size: 11px; letter-spacing: .05em; text-transform: uppercase; }
.validation-note span { font-size: 11px; }

.app {
  min-height: 100vh;
  background: radial-gradient(circle at 72% 0%, rgba(31, 157, 206, .08), transparent 28rem), var(--canvas);
  transition: background 180ms ease, color 180ms ease;
}

.topbar {
  align-items: center;
  background: linear-gradient(115deg, #062f3d, #084a5e);
  box-shadow: 0 4px 18px rgba(6, 47, 61, .16);
  color: #fff;
  display: grid;
  gap: 24px;
  grid-template-columns: minmax(230px, 1fr) auto minmax(300px, 1fr);
  height: calc(78px + env(safe-area-inset-top));
  padding: env(safe-area-inset-top) 28px 0;
  position: sticky;
  top: 0;
  z-index: 30;
}

.brand {
  align-items: center;
  background: transparent;
  border: 0;
  color: #fff;
  cursor: pointer;
  display: flex;
  gap: 12px;
  justify-self: start;
  padding: 0;
  text-align: left;
}
.brand-back {
  align-items: center;
  display: flex;
  font-size: 20px;
  font-weight: 900;
  justify-content: center;
}
.brand-mark {
  align-items: center;
  background: linear-gradient(145deg, #2bb8ed, #0c8ac5);
  border-radius: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .4);
  display: flex;
  font-size: 25px;
  font-weight: 900;
  height: 42px;
  justify-content: center;
  width: 42px;
}
.brand-logo {
  background: #fff;
  border: 1px solid rgba(255,255,255,.35);
  border-radius: 50%;
  height: 45px;
  object-fit: cover;
  width: 45px;
}
.brand strong { display: block; font-size: 19px; letter-spacing: .02em; }
.brand small {
  color: #9bdcf2;
  display: block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .16em;
  margin-top: 1px;
  text-transform: uppercase;
}
.aircraft { align-items: baseline; display: flex; gap: 8px; justify-self: center; white-space: nowrap; }
.aircraft strong { font-size: 17px; }
.aircraft span { color: #d9edf3; font-size: 15px; }
.top-actions { align-items: center; display: flex; gap: 10px; justify-self: end; }
.top-actions button, .offline-badge {
  align-items: center;
  background: rgba(255, 255, 255, .07);
  border: 1px solid rgba(255, 255, 255, .28);
  border-radius: 8px;
  color: #fff;
  display: flex;
  font-size: 13px;
  font-weight: 700;
  height: 42px;
  padding: 0 14px;
}
.top-actions button { cursor: pointer; }
.top-actions button:hover { background: rgba(255, 255, 255, .14); }
.offline-badge i {
  background: #69d6b4;
  border-radius: 50%;
  box-shadow: 0 0 0 3px rgba(105, 214, 180, .15);
  height: 7px;
  margin-right: 8px;
  width: 7px;
}

.validation-banner {
  align-items: center;
  background: var(--yellow-soft);
  border-bottom: 1px solid #e3c95e;
  color: #51420e;
  display: flex;
  gap: 12px;
  justify-content: center;
  min-height: 40px;
  padding: 8px 18px;
  text-align: center;
}
.validation-banner strong {
  background: var(--yellow);
  border-radius: 5px;
  color: #332900;
  font-size: 11px;
  letter-spacing: .08em;
  padding: 4px 7px;
  white-space: nowrap;
}
.validation-banner span { font-size: 12px; font-weight: 700; }

.shell {
  display: grid;
  gap: 20px;
  grid-template-columns: 250px minmax(500px, 1fr) 260px;
  margin: 0 auto;
  max-width: 1540px;
  padding: 22px;
}
.phase-rail, .checklist-panel, .fact-card {
  background: rgba(252, 253, 253, .96);
  border: 1px solid var(--line);
  box-shadow: 0 7px 24px rgba(20, 50, 60, .055);
}
.phase-rail {
  align-self: start;
  border-radius: 12px;
  max-height: calc(100vh - 122px);
  overflow: hidden auto;
  position: sticky;
  top: 100px;
}
.rail-heading { align-items: center; display: flex; justify-content: space-between; padding: 18px 18px 10px; }
.rail-heading span {
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
  letter-spacing: .09em;
  text-transform: uppercase;
}
.rail-heading strong { color: var(--teal-700); font-size: 13px; }
.overall-track {
  background: #e8edef;
  height: 4px;
  margin: 0 18px 12px;
  overflow: hidden;
}
.overall-track i, .progress-track i {
  background: linear-gradient(90deg, var(--teal-700), var(--sky));
  display: block;
  height: 100%;
  transition: width 220ms ease;
}
.phase-rail nav { display: flex; flex-direction: column; padding: 0 8px 10px; }
.phase-rail nav button {
  align-items: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9px;
  cursor: pointer;
  display: grid;
  font-size: 13px;
  font-weight: 700;
  gap: 10px;
  grid-template-columns: 30px 1fr;
  min-height: 48px;
  padding: 7px 10px;
  text-align: left;
}
.phase-rail nav button:hover { background: #f1f7f8; }
.phase-rail nav button.active { background: var(--sky-soft); border-color: #9ed8ef; color: #0877a9; }
.phase-rail nav button.warning .phase-icon { border-color: #e3a0a0; color: var(--red); }
.phase-icon {
  align-items: center;
  border: 1.5px solid #9eabb0;
  border-radius: 50%;
  color: var(--muted);
  display: flex;
  font-size: 11px;
  font-weight: 800;
  height: 26px;
  justify-content: center;
  width: 26px;
}
.active .phase-icon { background: var(--sky); border-color: var(--sky); color: #fff; }

.checklist-panel { border-radius: 12px; min-width: 0; padding: 24px; }
.section-kicker, .phase-title-row, .navigation-actions, .card-heading {
  align-items: center;
  display: flex;
  justify-content: space-between;
}
.section-kicker > span { color: var(--sky); font-size: 12px; font-weight: 850; letter-spacing: .08em; }
.section-kicker button, .card-heading button {
  background: transparent;
  border: 0;
  color: var(--sky);
  cursor: pointer;
  font-size: 12px;
  font-weight: 750;
}
.phase-title-row { align-items: flex-end; margin-top: 8px; }
.phase-title-row h1 { font-size: clamp(32px, 4vw, 48px); letter-spacing: -.045em; line-height: 1.02; margin: 0; }
.phase-title-row p { color: var(--teal-700); font-size: 13px; font-weight: 700; margin: 9px 0 0; }
.phase-title-row > strong { color: var(--muted); font-size: 17px; }
.progress-track {
  background: #e5eaec;
  border-radius: 999px;
  height: 8px;
  margin: 12px 0 22px;
  overflow: hidden;
}
.checklist { display: flex; flex-direction: column; }
.check-row {
  align-items: center;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  display: grid;
  gap: 12px;
  grid-template-columns: 44px 24px minmax(150px, auto) minmax(20px, 1fr) minmax(150px, auto);
  margin-bottom: 9px;
  min-height: 68px;
  padding: 10px 14px;
  text-align: left;
  transition: border 150ms ease, background 150ms ease, transform 150ms ease;
  width: 100%;
}
.check-row:hover { border-color: #95cde2; transform: translateY(-1px); }
.check-row.done { background: #f1fbf7; border-color: #b6dfd3; }
.check-row.critical:not(.done) { border-left: 5px solid var(--yellow); }
.check-row.verify { background: var(--yellow-soft); border-color: #e8d17b; }
.check-box {
  align-items: center;
  background: #fff;
  border: 2px solid #aebbc0;
  border-radius: 7px;
  color: #fff;
  display: flex;
  font-size: 22px;
  font-weight: 900;
  height: 40px;
  justify-content: center;
  transition: all 150ms ease;
  width: 40px;
}
.done .check-box {
  background: linear-gradient(145deg, #119378, #08745f);
  border-color: var(--teal-700);
  box-shadow: 0 3px 8px rgba(11, 143, 120, .2);
}
.item-number { color: var(--teal-700); font-size: 13px; font-weight: 850; }
.item-copy { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.item-copy strong { font-size: 15px; line-height: 1.25; }
.item-copy small, .response small { color: var(--muted); font-size: 11px; font-weight: 600; line-height: 1.3; }
.dots { border-bottom: 2px dotted #c8d2d6; min-width: 20px; transform: translateY(2px); }
.response {
  color: var(--teal-700);
  display: flex;
  flex-direction: column;
  font-size: 14px;
  font-weight: 850;
  line-height: 1.25;
  text-align: right;
}
.verify .response { color: #816700; }
.navigation-actions { gap: 14px; margin-top: 20px; }
.navigation-actions button {
  border-radius: 9px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 800;
  min-height: 52px;
  padding: 0 22px;
}
.navigation-actions button:disabled { cursor: not-allowed; opacity: .38; }
.navigation-actions .secondary { background: #fff; border: 1px solid #b7c5ca; }
.navigation-actions .primary {
  background: linear-gradient(115deg, var(--teal-950), #07556a);
  border: 0;
  color: #fff;
  flex: 1;
}

.facts-rail {
  align-self: start;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: sticky;
  top: 100px;
}
.fact-card { border-radius: 12px; padding: 18px; }
.card-heading > strong, .fact-card > strong { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
.fact-card dl { margin: 13px 0 0; }
.fact-card dl div {
  align-items: center;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  padding: 12px 0;
}
.fact-card dt { color: var(--muted); font-size: 12px; }
.fact-card dd { font-size: 13px; font-weight: 850; margin: 0; }
.fact-card dl .highlight { background: var(--yellow); border: 0; border-radius: 7px; margin: 2px -8px; padding: 12px 8px; }
.fact-card dl .highlight dt { color: #4b3b00; font-weight: 750; }
.safety { border-top: 4px solid var(--teal-900); }
.safety p { color: var(--muted); font-size: 12px; line-height: 1.6; margin: 12px 0 0; }
.source span, .source small { color: var(--muted); display: block; font-size: 11px; }
.source strong { display: block; font-size: 13px; margin: 6px 0; text-transform: none; }
.mobile-phasebar, .mobile-footer { display: none; }

.balance-shell {
  display: grid;
  gap: 20px;
  grid-template-columns: minmax(340px, .72fr) minmax(520px, 1.28fr);
  margin: 0 auto;
  max-width: 1450px;

.static-app .method-callout p { color: var(--muted); font-size: 10px; line-height: 1.65; margin: 5px 0 0; }
.static-app .method-details { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.static-app .method-details summary { cursor: pointer; font-size: 11px; font-weight: 850; padding: 14px 16px; }
.static-app .method-table-wrap { border-top: 1px solid var(--line); max-height: 480px; overflow: auto; padding: 8px 14px 14px; }
.static-app .method-data-table { min-width: 670px; }
.static-app .documents-gallery { display: grid; gap: 12px; grid-template-columns: repeat(3,minmax(0,1fr)); }
.static-app .document-card { background: var(--paper); border: 1px solid var(--line); border-radius: 11px; color: inherit; display: grid; grid-template-columns: 92px 1fr; min-height: 126px; overflow: hidden; text-decoration: none; }
.static-app .document-card:hover { border-color: #91cada; transform: translateY(-1px); }
.static-app .document-card img { background: #e5eaec; height: 100%; object-fit: cover; width: 92px; }
.static-app .document-card span { align-self: center; display: block; padding: 11px; }
.static-app .document-card small, .static-app .document-card strong, .static-app .document-card em { display: block; }
.static-app .document-card small { color: var(--sky); font-size: 7px; font-weight: 850; letter-spacing: .05em; text-transform: uppercase; }
.static-app .document-card strong { font-size: 11px; line-height: 1.35; margin: 5px 0; }
.static-app .document-card em { color: var(--muted); font-size: 8px; font-style: normal; line-height: 1.4; }
.static-app .validation-checklist { background: var(--paper); border: 1px solid var(--line); border-radius: 11px; margin: 0; padding: 12px 18px 12px 34px; }
.static-app .validation-checklist li { color: var(--muted); font-size: 10px; line-height: 1.55; margin: 6px 0; }
.night .density-inputs label > div, .night .density-metrics div { background: #142b3a; border-color: #315978; }
.night .density-warning { background: #332d13; border-color: #665b2d; color: #f7e49a; }
.night .performance-input-panel, .night .performance-result-panel, .night .performance-empty { background: #0d1c23; }
.night .performance-input-grid label > div, .night .field-row label > div, .night .performance-metrics div, .night .choice-toggle { background: #142b3a; border-color: #315978; }
.night .field-row .icao-entry input { background: #071219; border-color: #4f91a7; }
.night .performance-warning { background: #10242d; }
.night .method-copy-grid article, .night .method-steps, .night .method-details, .night .document-card, .night .validation-checklist, .night .airfield-readout select { background: #0d1c23; }
.night .airfield-readout, .night .method-callout { background: #142b3a; border-color: #315978; }
.night .method-callout.danger { background: #351c1b; border-color: #703f3a; }
@keyframes screenEnter { from { opacity: .45; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (max-width: 820px) {
  .static-app .app-footer-note { padding: 0 14px 18px; }
  .static-app .aircraft-card { width: 100%; }
  .static-app .bases-page { padding: 24px 13px 34px; }
  .static-app .bases-intro h1 { font-size: 39px; }
  .static-app .bases-grid { grid-template-columns: 1fr; }
  .static-app .bases-card-header, .static-app .bases-section { padding-left: 15px; padding-right: 15px; }
  .static-app .utility-card { grid-template-columns: 50px 1fr 24px; padding: 12px; }
  .static-app .utility-list { grid-template-columns: 1fr; }
  .static-app .utility-symbol { height: 50px; }
  .static-app .density-page { padding: 24px 13px 34px; }
  .static-app .density-intro h1 { font-size: 39px; }
  .static-app .density-grid { grid-template-columns: 1fr; }
  .static-app .density-panel { padding: 15px; }
  .static-app .density-metrics { grid-template-columns: 1fr 1fr; }
  .static-app .density-metrics div:first-child { grid-column: 1 / span 2; }
  .static-app .performance-page { padding: 24px 13px 36px; }
  .static-app .performance-layout { grid-template-columns: 1fr; }
  .static-app .performance-input-grid { grid-template-columns: 1fr 1fr; }
  .static-app .performance-metrics { grid-template-columns: 1fr 1fr; }
  .static-app .method-section { display: block; padding: 28px 0; }
  .static-app .method-number { margin-bottom: 12px; }
  .static-app .method-copy-grid, .static-app .documents-gallery { grid-template-columns: 1fr; }
}
</style>

  function pointOnSegment(point, start, end) {
    const px = point[0], py = point[1], ax = start[0], ay = start[1], bx = end[0], by = end[1];
    const dx = bx - ax, dy = by - ay;
    const length = Math.hypot(dx, dy);
    if (length === 0) return Math.hypot(px - ax, py - ay) <= 1e-8;
    const cross = (px - ax) * dy - (py - ay) * dx;
    if (Math.abs(cross) / length > 1e-8) return false;
    const dot = (px - ax) * (bx - ax) + (py - ay) * (by - ay);
    if (dot < -1e-8) return false;
    return dot <= dx ** 2 + dy ** 2 + 1e-8;
  }

  function pointInEnvelope(point, envelope) {
    for (let index = 0; index < envelope.length; index += 1) {
      if (pointOnSegment(point, envelope[index], envelope[(index + 1) % envelope.length])) return true;
    }
    let inside = false;
    for (let index = 0, previous = envelope.length - 1; index < envelope.length; previous = index, index += 1) {
      const xi = envelope[index][0], yi = envelope[index][1];
      const xj = envelope[previous][0], yj = envelope[previous][1];
      const intersects = yi > point[1] !== yj > point[1] && point[0] < ((xj - xi) * (point[1] - yi)) / (yj - yi) + xi;
      if (intersects) inside = !inside;
    }
    return inside;
  }

    const reviewText = !checklist ? 'La check-list ' + aircraft.registration + ' n’a pas encore été fournie.' : checklist.reviewNote ? checklist.reviewNote : checklist.partial ? 'La partie reçue a été transcrite ; les autres sections restent à fournir.' : 'La check-list F-HDLT contient encore trois lignes signalées « à confirmer ».';
    const dataStrip = balance ? '<div class="aircraft-data-strip"><div><span>Masse maximale</span><strong>' + formatFr(balance.maxMass, 0) + ' kg</strong></div><div><span>Masse à vide</span><strong>' + formatFr(balance.emptyMass, 1) + ' kg</strong></div><div><span>Carburant calculé</span><strong>' + formatFr(balance.fuelDensity, 2) + ' kg/l</strong></div><div><span>Motorisation</span><strong>' + escapeHtml(balance.engine) + '</strong></div></div>' : '';
    return '<main class="' + appClass() + '">' + header('OUTILS DE VOL', aircraft.name, 'home', '<button class="desktop-only" data-action="documents">Documents</button>') +
      '<section class="aircraft-hub"><button class="text-back" data-action="screen" data-screen="home">← Choisir un autre avion</button>' +
      '<div class="aircraft-identity"><div class="registration-stamp">' + escapeHtml(aircraft.registration) + '</div><div><span class="eyebrow">' + escapeHtml(aircraft.type) + '</span><h1>' + escapeHtml(aircraft.name) + '</h1><p>Choisir l’outil à utiliser pour cet appareil.</p></div></div>' +
      '<div class="module-grid"><button class="module-card checklist-module" data-action="screen" data-screen="checklist"' + (checklist ? '' : ' disabled') + '>' +
      '<span class="module-index">01</span><span class="module-symbol">✓</span><span class="module-copy"><small>' + (checklist ? 'Fiche propre à l’avion' : 'Document requis') + '</small><strong>Check-list</strong><p>' + escapeHtml(checklistText) + '</p></span><span class="module-cta">' + (checklist ? 'Ouvrir →' : 'À venir') + '</span></button>' +
      '<button class="module-card balance-module" data-action="screen" data-screen="balance"' + (balance ? '' : ' disabled') + '><span class="module-index">02</span><span class="module-symbol">⚖</span><span class="module-copy"><small>' + (balance ? 'Calcul repris des fichiers transmis' : 'Document requis') + '</small><strong>Masse & centrage</strong><p>' + escapeHtml(balanceText) + '</p></span><span class="module-cta">' + (balance ? 'Calculer →' : 'À venir') + '</span></button>' +
      '<button class="module-card performance-module" data-action="screen" data-screen="performance"' + (performance ? '' : ' disabled') + '><span class="module-index">03</span><span class="module-symbol">↗</span><span class="module-copy"><small>' + (performance ? escapeHtml(performance.status) : 'Document requis') + '</small><strong>Performances</strong><p>' + escapeHtml(performanceText) + '</p></span><span class="module-cta">' + (performance ? 'Préparer →' : 'À venir') + '</span></button></div>' +
      dataStrip +
      '<div class="validation-note"><strong>Version à valider par le club</strong><span>' + escapeHtml(reviewText) + '</span></div>' +
      '</section>' + footerNote() + '</main>';
  }

  function baseValues(balance) {
    return '<div class="bases-values">' +
      '<div><span>Masse à vide</span><b>' + formatFr(balance.emptyMass, 1) + ' kg</b></div>' +
      '<div><span>Bras à vide</span><b>' + formatFr(balance.emptyArm, 5) + ' m</b></div>' +
      '<div><span>Masse maximale</span><b>' + formatFr(balance.maxMass, 0) + ' kg</b></div>' +
      '<div><span>Densité carburant</span><b>' + formatFr(balance.fuelDensity, 2) + ' kg/l</b></div>' +
      '</div>';
  }

  function stationRows(balance) {
    return balance.inputs.map(function(input) {
      const defaultDisplay = input.defaultValue === '' ? 'À saisir' : input.unit === 'litres' ? formatFr(input.defaultValue, 0) + ' l' : formatFr(input.defaultValue, 1) + ' kg';
      const maxDisplay = input.max == null ? 'Non fourni' : input.unit === 'litres' ? formatFr(input.max, 0) + ' l' : formatFr(input.max, 0) + ' kg';
      return '<tr><td>' + escapeHtml(input.rowLabel) + '</td><td>' + formatFr(input.arm, 3) + ' m</td><td>' + defaultDisplay + '</td><td>' + maxDisplay + '</td></tr>';
    }).join('');
  }

  function envelopeText(balance) {
    const points = balance.momentEnvelope || balance.envelope;
    return points.map(function(point) {
      return balance.momentEnvelope ? formatFr(point[0], 0) + ' kg·m / ' + formatFr(point[1], 0) + ' kg' : formatFr(point[0], 3) + ' m / ' + formatFr(point[1], 0) + ' kg';
    }).join(' · ');
  }

  function performanceReferenceTables() {
    const sportRows = sportStarPerformance.isaDeviations.map(function(deviation){
      return sportStarPerformance.altitudes.map(function(altitude,index){
        const values=sportStarPerformance.values[String(deviation)][index];
        const oat=sportStarPerformance.isaTemperatures[index]+deviation;
        return '<tr><td>ISA'+(deviation===0?'':deviation>0?'+'+deviation:'−'+Math.abs(deviation))+'</td><td>'+formatFr(altitude,0)+'</td><td>'+formatFr(oat,1)+'</td>'+values.map(function(value){return '<td>'+value+'</td>';}).join('')+'</tr>';
      }).join('');
    }).join('');
    const drRows = dr400Performance.masses.map(function(mass){
      return dr400Performance.altitudes.map(function(altitude){
        return dr400Performance.isaDeviations.map(function(deviation,index){
          const values=dr400Performance.values[String(mass)][String(altitude)][index];
          return '<tr><td>'+mass+'</td><td>'+altitude+'</td><td>ISA'+(deviation===0?'':deviation>0?'+'+deviation:'−'+Math.abs(deviation))+'</td>'+values.map(function(value){return '<td>'+value+'</td>';}).join('')+'</tr>';
        }).join('');
      }).join('');
    }).join('');
    const header='<thead><tr><th>Condition</th><th>Altitude ft</th><th>OAT °C</th><th>Dur roul.</th><th>Dur 50 ft</th><th>Herbe roul.</th><th>Herbe 50 ft</th></tr></thead>';
    const drHeader='<thead><tr><th>Masse kg</th><th>Altitude ft</th><th>Condition</th><th>Dur roul.</th><th>Dur 50 ft</th><th>Herbe roul.</th><th>Herbe 50 ft</th></tr></thead>';
    return '<details class="method-details"><summary>Afficher les 24 lignes SportStar RTC transcrites</summary><div class="method-table-wrap"><table class="bases-table method-data-table">'+header+'<tbody>'+sportRows+'</tbody></table></div></details><details class="method-details"><summary>Afficher les 18 lignes DR400/180 génériques transcrites</summary><div class="method-table-wrap"><table class="bases-table method-data-table">'+drHeader+'<tbody>'+drRows+'</tbody></table></div></details>';
  }

  function documentsGallery() {
    return '<div class="documents-gallery">'+sourceDocuments.map(function(document){
      return '<a class="document-card" href="'+escapeHtml(document.file)+'" target="_blank" rel="noopener"><img src="'+escapeHtml(document.file)+'" loading="lazy" alt="Aperçu : '+escapeHtml(document.title)+'"><span><small>'+escapeHtml(document.aircraft+' · '+document.category)+'</small><strong>'+escapeHtml(document.title)+'</strong><em>'+escapeHtml(document.status)+'</em></span></a>';
    }).join('')+'</div>';
  }

  function calculationBasesView() {
    return '<main class="' + appClass() + '">' +
      '<header class="cover-topbar"><div class="club-brand">' + logoImage('') + '<span><strong>Aéroclub Jean-Doudiès</strong><small>Bases de calcul</small></span></div><div class="cover-actions bases-actions"><button data-action="screen" data-screen="home">← Avions</button><button data-action="theme">' + (state.night ? '☀ Jour' : '☾ Nuit') + '</button></div></header>' +
      '<section class="bases-page methods-page"><div class="bases-intro"><span class="eyebrow">Transparence, traçabilité et prudence</span><h1>Méthodes, données et limites</h1><p>Cette page décrit les données entrées dans l’application, chaque transformation mathématique et les cas où le moteur refuse de produire un verdict. Elle est volontairement détaillée pour permettre un contrôle indépendant. Les scans sont consultables à la fin de la page.</p></div>' +
      '<div class="bases-alert"><strong>Prototype non approuvé</strong><span>Aucun résultat ne remplace le manuel de vol approuvé, sa version applicable à l’aéronef, la fiche de pesée en vigueur, la VAC, les NOTAM, le briefing météo ni la décision du commandant de bord. Les hypothèses F-HDLV, les tables SportStar actives et le manuel générique DR400 doivent être validés par le club.</span></div>' +
      '<nav class="method-index"><a href="#masse">Masse & centrage</a><a href="#atmosphere">Atmosphère</a><a href="#performances">Performances</a><a href="#terrains">Terrains & météo</a><a href="#sources">Scans sources</a><a href="#validation">À valider</a></nav>'+
      '<section class="method-section" id="masse"><span class="method-number">01</span><div class="method-heading"><span>Calcul par aéronef</span><h2>Masse et centrage</h2><p>Chaque poste produit une masse et un moment. La somme des moments est divisée par la masse totale. Le contrôle géométrique est inclusif sur les frontières numérisées ; une valeur absente, négative, supérieure à une limite documentée, une surcharge ou un point hors enveloppe bloque le résultat.</p></div>'+
      '<div class="bases-grid">' +
      '<article class="bases-card"><div class="bases-card-header"><span>F-HDLT · valeurs appliquées provisoirement au F-HDLV</span><h2>Evektor SportStar</h2></div>' +
      '<div class="bases-section"><strong>Valeurs générales</strong>' + baseValues(sportStarBalance) + '</div>' +
      '<div class="bases-section"><strong>Postes de chargement et valeurs de saisie</strong><table class="bases-table"><thead><tr><th>Élément</th><th>Bras</th><th>Valeur initiale</th><th>Maximum</th></tr></thead><tbody>' + stationRows(sportStarBalance) + '</tbody></table></div>' +
      '<div class="bases-section"><strong>Enveloppe utilisée</strong><p class="bases-copy">Le document publie un graphique moment–masse. La décision est donc effectuée dans ce repère, sans transformer ses droites en segments de centrage erronés. Sommets numérisés (moment / masse) : ' + envelopeText(sportStarBalance) + '. Cette numérisation doit être contrôlée sur le manuel original.</p></div>' +
      '<div class="bases-section"><strong>Source</strong><p class="bases-copy">' + escapeHtml(sportStarBalance.source) + '</p></div></article>' +
      '<article class="bases-card"><div class="bases-card-header"><span>F-GGHL</span><h2>Robin DR400</h2></div>' +
      '<div class="bases-section"><strong>Valeurs générales</strong>' + baseValues(dr400Balance) + '</div>' +
      '<div class="bases-section"><strong>Postes de chargement et valeurs de saisie</strong><table class="bases-table"><thead><tr><th>Élément</th><th>Bras</th><th>Valeur initiale</th><th>Maximum</th></tr></thead><tbody>' + stationRows(dr400Balance) + '</tbody></table></div>' +
      '<div class="bases-section"><strong>Enveloppe utilisée</strong><p class="bases-copy">Catégorie Normale seulement. Sommets (centrage / masse) : ' + envelopeText(dr400Balance) + '. La catégorie Utilitaire à 950 kg visible sur la fiche n’est pas évaluée. Les maxima individuels des sièges et bagages ne sont pas inventés lorsqu’ils ne figurent pas sur le scan : ils doivent être contrôlés dans le manuel.</p></div>' +
      '<div class="bases-section"><strong>Source</strong><p class="bases-copy">' + escapeHtml(dr400Balance.source) + '</p></div></article></div>' +
      '<div class="formula-card"><strong>Formules et arrondis</strong><p>Moment poste = masse × bras. Moment total = moment à vide publié + somme des moments. CG = moment total ÷ masse totale. Le moment à vide officiel est conservé : 95,64 kg·m pour F-HDLT et 201,488 kg·m pour F-GGHL. Carburant : 0,72 kg/l. Sur F-GGHL, les 10 l non consommables sont déjà inclus dans la masse à vide : masse principale ajoutée = max(0, litres totaux à bord − 10) × 0,72. Aucun arrondi intermédiaire n’est appliqué ; l’exemple papier DR400 arrondit 57,6 kg à 58 kg, d’où un petit écart reproductible.</p></div></section>'+
      '<section class="method-section" id="atmosphere"><span class="method-number">02</span><div class="method-heading"><span>Terminologie et thermodynamique</span><h2>Altitude-pression et altitude-densité</h2></div><div class="method-copy-grid"><article><h3>Altitude du terrain</h3><p>C’est l’élévation géométrique publiée sur la carte. Elle ne devient altitude-pression que lorsque la pression correspond à l’atmosphère standard. À QNH 1013,25 hPa, l’altitude-pression est pratiquement égale à l’altitude publiée ; à 15 °C au niveau de la mer, l’altitude-densité vaut environ 0 ft, mais à un terrain élevé elle reste voisine de l’altitude de ce terrain.</p></article><article><h3>Altitude-pression</h3><p>Le moteur estime d’abord la pression statique au terrain à partir du QNH et de l’élévation dans l’atmosphère ISA, puis recherche l’altitude ISA possédant cette même pression. C’est l’axe vertical utilisé par les tables de performance, sous réserve de validation de l’intitulé « altitude de l’aéroport » du scan SportStar.</p></article><article><h3>Altitude-densité</h3><p>La densité est obtenue par l’équation des gaz parfaits avec la pression au terrain et la température extérieure, puis convertie en altitude ISA équivalente. L’altitude-densité sert à comprendre l’état de l’air ; elle ne remplace pas simultanément altitude-pression et température dans une table, car ce serait compter deux fois l’effet thermique.</p></article><article><h3>Humidité facultative</h3><p>Dans le calculateur autonome, le point de rosée permet un calcul atmosphérique général de la densité de l’air humide, indépendant de tout avion. C’est seulement dans l’onglet Performances que cette densité est convertie en altitude-pression sèche équivalente puis appliquée à la table de l’avion : cette utilisation complémentaire n’est pas une méthode publiée dans le manuel et reste clairement signalée.</p></article></div><div class="formula-card"><strong>Constantes</strong><p>ISA au niveau de la mer : 15 °C, 1013,25 hPa et 1,225 kg/m³. Gradient troposphérique : 0,0065 K/m. Gravité : 9,80665 m/s². Constantes spécifiques : air sec 287,05 J/(kg·K), vapeur d’eau 461,495 J/(kg·K). Le point de rosée est converti en pression de vapeur par une relation de Magnus.</p></div></section>'+
      '<section class="method-section" id="performances"><span class="method-number">03</span><div class="method-heading"><span>Décollage</span><h2>Tables et interpolation</h2><p>Le calcul est effectué après le contrôle masse/centrage. Les distances de roulement et de passage des 15 m / 50 ft sont interpolées séparément, puis arrondies au mètre supérieur. Une interpolation ne crée un résultat qu’entre des points publiés ; aucune extrapolation n’est autorisée.</p></div><ol class="method-steps"><li><strong>Atmosphère.</strong> Calculer l’altitude-pression et la température ISA correspondante.</li><li><strong>Position dans la table.</strong> Écart ISA = OAT − température ISA. Pour le SportStar, les températures ISA imprimées sont interpolées afin de respecter exactement les nœuds publiés.</li><li><strong>Interpolation.</strong> SportStar : bilinéaire altitude-pression × écart ISA. DR400 : trilinéaire masse × altitude-pression × écart ISA entre 900 et 1 100 kg. Sous 900 kg, la ligne publiée à 900 kg est conservée sans extrapolation vers le bas. Dur et herbe sont deux colonnes distinctes, jamais interpolées entre elles.</li><li><strong>Corrections.</strong> Aucun gain de masse, pente descendante ou humidité n’est inventé. Le vent moyen du METAR et le relèvement vrai du QFU servent à proposer la piste puis la composante longitudinale. Le secteur variable et les rafales sont affichés séparément ; ils ne remplacent pas silencieusement le vent moyen. Si le secteur variable traverse vent de face et vent arrière, 0 kt est proposé et doit être confirmé ou ajusté. Le DR400 générique applique seulement les facteurs de vent de face publiés entre 0 et 30 kt. Vent arrière, piste montante et vent au-delà de 30 kt : hors table. Pour le SportStar RTC, aucune correction vent/pente n’est empruntée aux deux séries photographiées mais non identifiées.</li><li><strong>Marge additionnelle.</strong> Une marge pilote/club de 0 à 100 % est appliquée après interpolation et après la comparaison d’humidité : distance retenue = distance calculée × (1 + marge/100), puis arrondi au mètre supérieur. La valeur initiale est 0 % et doit être ajustée selon la politique du club et la décision du pilote ; elle ne prétend pas constituer une consigne du club.</li><li><strong>Piste.</strong> Le roulement retenu est comparé à la TORA ; la distance retenue au passage des 50 ft à la TODA. Les deux marges doivent être positives. Le QFU proposé d’après le METAR reste une aide : piste en service, VAC, NOTAM et informations du jour doivent être vérifiés. Les choix affichés sont « Dur sec », « Dur mouillé », « Herbe sèche » et « Herbe mouillée », filtrés selon la piste sélectionnée. Les deux états mouillés restent hors table tant qu’aucun facteur applicable n’est validé.</li><li><strong>Confirmations.</strong> Chargement, conditions du jour, piste et distances portent le badge « obligatoire » et doivent être confirmés explicitement. La comparaison avec l’air humide porte le badge « facultatif » et ne bloque pas le calcul lorsqu’elle est désactivée. Les confirmations expirent après 60 minutes et ne traversent pas un rechargement.</li><li><strong>Verdict.</strong> Une donnée ou confirmation manquante produit « CALCUL BLOQUÉ ». Un axe ou une condition non couverte produit « HORS TABLE ». Dans les deux cas, les informations certaines sont conservées mais aucun avis de piste n’est donné. Tant que la série SportStar n’est pas validée par le club, une piste suffisante reste affichée comme marge indicative, jamais comme verdict vert approuvé.</li></ol>'+ 
      '<div class="method-callout danger"><strong>Exemple volontairement extrême</strong><p>À 3 000 ft de pression et 38,5 °C, la température ISA interpolée du tableau SportStar est 9,05 °C : l’écart vaut ISA+29,45 °C. La table active s’arrête à ISA+20 °C, soit environ 29,05 °C à cette altitude. Le dépassement de 9,45 °C force donc « HORS TABLE » ; aucune distance n’est extrapolée, même si la piste fait 800 m.</p></div><div class="method-copy-grid"><article><h3>SportStar RTC</h3><p>Domaine actif : 0 à 10 000 ft et ISA−10 à ISA+20 °C. La famille est identifiée par « EVEKTOR SPORTSTAR RTC — Page 60 ». Les clichés ne montrent pas toutes les conditions générales — masse de référence, volets, technique, régime, état exact de piste, hélice — qui restent à confirmer. Les valeurs sont appliquées provisoirement à F-HDLT et F-HDLV.</p></article><article><h3>DR400/180</h3><p>Table générique, édition 13, et non une table approuvée spécifiquement pour F-GGHL (N/S 1835). Axes publiés : masses 900 et 1 100 kg, altitude 0 à 8 000 ft et ISA−20 à ISA+20 °C. Une masse réelle inférieure à 900 kg utilise explicitement et conservativement la ligne 900 kg ; une masse supérieure à 1 100 kg reste hors table. Hélice, carénages, suppléments et révision applicable doivent être validés. Aucun résultat ne doit être présenté comme constructeur propre à HL.</p><p><a href="https://manualzilla.com/doc/6382928/manuel-de-vol-robin-dr400-180" target="_blank" rel="noopener">Copie du manuel générique utilisé ↗</a> · <a href="https://www.easa.europa.eu/en/document-library/type-certificates/aircraft-cs-25-cs-22-cs-23-cs-vla-cs-lsa/easaa367-ceapr-dr-200" target="_blank" rel="noopener">Fiche de type EASA ↗</a></p></article></div>'+performanceReferenceTables()+'</section>'+ 
      '<section class="method-section" id="terrains"><span class="method-number">04</span><div class="method-heading"><span>Données publiques et données du jour</span><h2>Terrains, VAC, METAR et TAF</h2></div><div class="method-copy-grid"><article><h3>SIA et VAC</h3><p>Les données numériques SIA sont diffusées par cycle AIRAC sous Licence Ouverte / Etalab 2.0. Un import hors ligne du catalogue officiel AD 1.3/AIXM produit le fichier local utilisé pour rechercher les aérodromes, leur élévation, leurs QFU, dimensions, surfaces, relèvements vrais et altitudes de seuil. Les TORA/TODA ne sont préremplies que lorsqu’une distance déclarée fiable est intégrée ; sinon elles restent à vérifier. La pente n’est pas un champ publié dans cet export : 0 % est alors proposé et explicitement étiqueté « non publiée ». La VAC en vigueur, les NOTAM et les distances déclarées priment toujours.</p><p><a href="https://www.sia.aviation-civile.gouv.fr/donnees-aeronautiques-xml-airac-08-26.html" target="_blank" rel="noopener">XML AIRAC SIA 08/26 ↗</a> · <a href="https://www.sia.aviation-civile.gouv.fr/atlas-vac.html" target="_blank" rel="noopener">Atlas VAC ↗</a></p></article><article><h3>METAR et TAF</h3><p>Le navigateur interroge un relais serveur local, qui consulte Aviation Weather Center et met en cache METAR 60 s et TAF 600 s. Le calculateur d’altitude-densité peut remplir l’élévation depuis le jeu terrain et QNH, température et point de rosée depuis un METAR récent. En performances, le vent moyen sert à proposer le QFU offrant la meilleure composante longitudinale puis à remplir la composante. Le secteur variable et les rafales sont montrés séparément ; si la variation traverse vent de face et vent arrière, 0 kt est proposé par défaut. Le pilote peut toujours changer de piste et ajuster le vent. Le TAF est affiché mais n’alimente jamais un calcul instantané. Une station voisine — par exemple LFMK pour LFMW — n’est jamais équivalente aux conditions sur le terrain : l’écart est signalé.</p><p><a href="https://aviationweather.gov/data/api/" target="_blank" rel="noopener">Documentation AWC ↗</a></p></article><article><h3>Ce que le METAR ne sait pas</h3><p>Il ne garantit ni vent exact au seuil, ni piste en service, ni état de piste, ni pente, ni herbe sèche/courte, ni TORA réellement disponible, ni obstacle temporaire. La proposition de QFU ne remplace donc jamais la VAC, les NOTAM ou les informations du jour. Le point de rosée permet un calcul d’humidité ; il ne transforme pas cette correction en donnée approuvée du manuel. Sur un terrain de montagne, un altiport ou une altisurface, la documentation terrain, les procédures et la réglementation propres aux conditions particulières doivent être consultées.</p></article><article><h3>Défaillance sûre</h3><p>Terrain et météo sont chargés indépendamment : terrain présent sans METAR, METAR présent sans terrain, ou saisie entièrement manuelle restent possibles. Une API absente, un METAR sans QNH/température, un horodatage absent/futur/ancien ou une piste non choisie n’invente aucune valeur. Les conditions météo et confirmations sont effacées à chaque nouveau chargement de l’application ; toute valeur par défaut reste signalée et doit être contrôlée.</p></article></div></section>'+ 
      '<section class="method-section" id="sources"><span class="method-number">05</span><div class="method-heading"><span>Traçabilité documentaire</span><h2>Scans utilisés et documents écartés</h2><p>Les deux premières familles Evektor non identifiées restent consultables mais ne participent à aucun calcul. Leurs corrections de vent arrière et de pente ne sont pas transférées au SportStar RTC.</p></div>'+documentsGallery()+'</section>'+
      '<section class="method-section" id="validation"><span class="method-number">06</span><div class="method-heading"><span>Relecture club</span><h2>Points à confirmer avant diffusion</h2></div><ul class="validation-checklist"><li>Applicabilité de la pesée F-HDLT au F-HDLV et enveloppe SportStar numérisée.</li><li>Identification de la série de performances RTC et de toutes ses conditions générales manquantes sur les photos.</li><li>Version exacte du manuel, hélice, suppléments et facteurs applicables au F-GGHL.</li><li>Limites structurelles par poste et traitement éventuel de la catégorie Utilitaire du DR400.</li><li>Jeu SIA, cycle AIRAC, surfaces et distances déclarées ; stratégie de mise à jour tous les 28 jours.</li><li>Textes des check-lists encore incomplets ou peu lisibles.</li><li>Cas de test chiffrés et politique « plus restrictif / hors table ».</li></ul><div class="method-callout"><strong>Principe de publication</strong><p>Après validation, chaque donnée doit porter son aéronef, sa source, sa révision et sa date d’effet. Une nouvelle pesée ou révision de manuel doit invalider explicitement l’ancienne configuration au lieu de la modifier silencieusement.</p></div></section></section>' + footerNote() + '</main>';
  }

  function atmosphereResult(values) {
    const toDensityNumber = function(value) {
      if (value === null || value === undefined || String(value).trim() === '') return NaN;
      return Number(String(value).replace(',', '.'));
    };
    const elevation = toDensityNumber(values.elevation);
    const qnh = toDensityNumber(values.qnh);
    const temperature = toDensityNumber(values.temperature);
    const dewPoint = toDensityNumber(values.dewPoint);

  function axisBracket(axis, value) {
    if (!Number.isFinite(value) || value < axis[0] || value > axis[axis.length - 1]) return null;
    if (value === axis[axis.length - 1]) return { low: axis.length - 1, high: axis.length - 1, ratio: 0 };

        return { low: index, high: index + 1, ratio: (value - axis[index]) / (axis[index + 1] - axis[index]) };

    return null;
  }

  function interpolateVector(start, end, ratio) { return start.map(function(value, index) { return interpolateNumber(value, end[index], ratio); }); }

  function interpolateSportStar(performance, pressureAltitude, isaDeviation) {
    const altitudeBracket = axisBracket(performance.altitudes, pressureAltitude);
    const deviationBracket = axisBracket(performance.isaDeviations, isaDeviation);
    if (!altitudeBracket || !deviationBracket) return null;
    const lowDeviation = String(performance.isaDeviations[deviationBracket.low]);
    const highDeviation = String(performance.isaDeviations[deviationBracket.high]);
    const lowAtAltitude = interpolateVector(performance.values[lowDeviation][altitudeBracket.low], performance.values[lowDeviation][altitudeBracket.high], altitudeBracket.ratio);
    const highAtAltitude = interpolateVector(performance.values[highDeviation][altitudeBracket.low], performance.values[highDeviation][altitudeBracket.high], altitudeBracket.ratio);
    return interpolateVector(lowAtAltitude, highAtAltitude, deviationBracket.ratio);
  }

  function interpolateDr400(performance, mass, pressureAltitude, isaDeviation) {

    if (!massBracket || !altitudeBracket || !deviationBracket) return null;
    const atMass = function(massIndex) {
      const massKey = String(performance.masses[massIndex]);
      const atAltitude = function(altitudeIndex) {
        const altitudeKey = String(performance.altitudes[altitudeIndex]);
        const rows = performance.values[massKey][altitudeKey];
        return interpolateVector(rows[deviationBracket.low], rows[deviationBracket.high], deviationBracket.ratio);
      };
      return interpolateVector(atAltitude(altitudeBracket.low), atAltitude(altitudeBracket.high), altitudeBracket.ratio);
    };

  }

  function headwindFactor(performance, headwind) {

    const capped = Math.min(headwind, performance.headwindFactors[performance.headwindFactors.length - 1][0]);
    for (let index = 0; index < performance.headwindFactors.length - 1; index += 1) {

  function confirmationTimestampCurrent(raw,now) {

    const runwayConfirmationCurrent=departure.runwayConfirmed===true&&confirmationTimestampCurrent(departure.runwayConfirmedAt);

    if (performance.masses && Number.isFinite(mass) && mass > maximumPublishedMass) { issues.push('Masse hors table : maximum publié ' + maximumPublishedMass + ' kg.'); outOfTable=true; }
    if (!performance.masses && Number.isFinite(mass) && mass > performance.maxMass) { issues.push('Masse supérieure à la masse de référence de la table.'); outOfTable=true; }

  }

  function performanceView() {
    const aircraft = currentAircraft(), result = performanceResult(aircraft), departure = state.departure;

    if (!result.available) return '<main class="' + appClass() + '">' + header('PERFORMANCES', aircraft.name, 'aircraft', '') + '<section class="performance-page"><div class="performance-empty"><strong>Performances non disponibles</strong><p>' + escapeHtml(result.issues[0]) + '</p></div></section>' + footerNote() + '</main>';
    const selectedRunway=selectedPublishedRunway();
    const surfaceOptions=availableSurfaceOptions(selectedRunway?{runways:[selectedRunway]}:state.airfield.record);

  function checklistView() {
    ensureChecklistSessionCurrent();
    const aircraft = currentAircraft();
    const checklist = aircraft.checklist;
    if (!checklist) { state.screen = 'aircraft'; return aircraftView(); }
    const phases = checklist.phases;
    state.phaseIndex = Math.max(0, Math.min(state.phaseIndex, phases.length - 1));
    const phase = phases[state.phaseIndex];
    const aircraftChecked = state.checked[aircraft.id] || {};
    const count = phase.items.filter(function(_, index) { return aircraftChecked[itemKey(phase, index)]; }).length;
    const percent = Math.round((count / phase.items.length) * 100);
    const totalItems = phases.reduce(function(sum, candidate) { return sum + candidate.items.length; }, 0);
    const totalDone = phases.reduce(function(sum, candidate) { return sum + candidate.items.filter(function(_, index) { return aircraftChecked[itemKey(candidate, index)]; }).length; }, 0);
    const overall = Math.round((totalDone / totalItems) * 100);
    const phaseNav = phases.map(function(candidate, index) {
      const completed = candidate.items.every(function(_, itemIndex) { return aircraftChecked[itemKey(candidate, itemIndex)]; });
      return '<button class="' + (candidate.id === phase.id ? 'active ' : '') + (candidate.warning ? 'warning' : '') + '" data-action="phase" data-index="' + index + '"><span class="phase-icon">' + (completed ? '✓' : index + 1) + '</span><span>' + escapeHtml(candidate.short) + '</span></button>';
    }).join('');
    const rows = phase.items.map(function(item, index) {
      const key = itemKey(phase, index), done = Boolean(aircraftChecked[key]);
      return '<button class="check-row ' + (done ? 'done ' : '') + (item.critical ? 'critical ' : '') + (item.verify ? 'verify' : '') + '" data-action="check" data-index="' + index + '" aria-pressed="' + done + '">' +
        '<span class="check-box">' + (done ? '✓' : '') + '</span><span class="item-number">' + (index + 1) + '</span><span class="item-copy"><strong>' + escapeHtml(item.action) + '</strong>' + (item.note ? '<small>' + escapeHtml(item.note) + '</small>' : '') + '</span><span class="dots"></span><span class="response">' + escapeHtml(item.response) + (item.confirmationNote ? '<small>' + escapeHtml(item.confirmationNote) + '</small>' : item.verify ? '<small>À confirmer</small>' : '') + '</span></button>';
    }).join('');
    const facts = checklist.quickFacts || [];
    return '<main class="' + appClass() + '">' + header('FLIGHT CHECK', aircraft.name, 'aircraft', '<button class="desktop-only" data-action="screen" data-screen="balance">Masse & centrage</button><button class="desktop-only" data-action="facts">Repères</button>') +
      '<div class="validation-banner"><strong>VERSION À VALIDER</strong><span>' + escapeHtml(checklist.partial ? 'Partie reçue transcrite — cette check-list est incomplète et doit être complétée puis validée par le club.' : 'Prototype soumis au contrôle du club — ne remplace pas la check-list approuvée ni le manuel de vol.') + '</span></div>' +
      '<div class="mobile-phasebar"><button data-action="phases"><span>Phase ' + (state.phaseIndex + 1) + '/' + phases.length + '</span><strong>' + escapeHtml(phase.title) + '</strong><b>⌄</b></button><div class="overall-mini"><span>Vol</span><strong>' + overall + '%</strong></div></div>' +
      '<div class="shell"><aside class="phase-rail"><div class="rail-heading"><span>Phases de vol</span><strong>' + overall + '%</strong></div><div class="overall-track"><i style="width:' + overall + '%"></i></div><nav>' + phaseNav + '</nav></aside>' +
      '<section class="checklist-panel"><div class="section-kicker"><span>' + (phase.warning ? 'PROCÉDURE PARTICULIÈRE' : 'CHECK-LIST NORMALE') + '</span><button data-action="reset-checklist">Nouveau vol</button></div>' +
      '<div class="phase-title-row"><div><h1>' + escapeHtml(phase.title) + '</h1><p>' + count + ' / ' + phase.items.length + ' éléments confirmés</p></div><strong>' + percent + '%</strong></div><div class="progress-track"><i style="width:' + percent + '%"></i></div><div class="checklist">' + rows + '</div>' +
      '<div class="navigation-actions"><button class="secondary" data-action="phase" data-index="' + (state.phaseIndex - 1) + '"' + (state.phaseIndex === 0 ? ' disabled' : '') + '>← Précédent</button><button class="primary" data-action="phase" data-index="' + (state.phaseIndex + 1) + '"' + (state.phaseIndex === phases.length - 1 ? ' disabled' : '') + '>' + (count === phase.items.length ? 'Phase validée' : 'Continuer') + ' →</button></div></section>' +
      '<aside class="facts-rail"><div class="fact-card accent"><div class="card-heading"><strong>Repères immédiats</strong><button data-action="facts">Tous</button></div><dl>' + facts.slice(0,4).map(function(fact, index) { return '<div class="' + (index === 2 ? 'highlight' : '') + '"><dt>' + escapeHtml(fact[0]) + '</dt><dd>' + escapeHtml(fact[1]) + '</dd></div>'; }).join('') + '</dl></div><div class="fact-card safety"><strong>Sécurité</strong><p>Aide-mémoire transcrit depuis la fiche ' + escapeHtml(aircraft.registration) + '. Le manuel de vol et la check-list approuvée demeurent les références.</p></div><div class="fact-card source"><span>Source</span><strong>' + escapeHtml(checklist.source) + '</strong><small>' + escapeHtml(checklist.sourceNote) + '</small></div></aside></div>' +

  function inputMass(input, value) {
    const chargeableValue = input.includedUnusableLitres == null ? value : Math.max(0, value - input.includedUnusableLitres);
    return chargeableValue * (input.massFactor || 1);
  }

  function balanceResult(aircraft) {
    const balance = aircraft.balance;
    const load = Object.assign({}, defaultLoad(balance), state.loads[aircraft.id] || {});
    const rows = [{label:'Masse à vide', mass:balance.emptyMass, arm:balance.emptyArm, moment:balance.emptyMoment == null ? balance.emptyMass * balance.emptyArm : balance.emptyMoment}];
    const violations = [];
    const groupTotals = {};
    balance.inputs.forEach(function(input) {
      const stored = load[input.key];
      const raw = stored === '' || stored === null || stored === undefined ? NaN : Number(String(stored).replace(',', '.'));
      const value = Number.isFinite(raw) && raw >= 0 ? raw : 0;
      const mass = inputMass(input, value);
      if (!Number.isFinite(raw)) violations.push(input.label + ' : valeur manquante ou invalide.');
      if (Number.isFinite(raw) && raw < 0) violations.push(input.label + ' : une valeur négative est impossible.');
      if (input.requiredPositive && Number.isFinite(raw) && raw <= 0) violations.push(input.label + ' : une masse strictement positive est obligatoire.');
      if (input.min != null && Number.isFinite(raw) && value < input.min) violations.push(input.label + ' : minimum cohérent ' + formatFr(input.min, 0) + ' ' + input.unit + '.');
      if (input.max != null && value > input.max) violations.push(input.label + ' : maximum ' + formatFr(input.max, input.unit === 'litres' ? 0 : 1) + ' ' + input.unit + ' dépassé.');
      if (input.group) groupTotals[input.group] = (groupTotals[input.group] || 0) + value;
      rows.push({label:input.rowLabel, mass:mass, arm:input.arm, moment:mass * input.arm, input:input, value:value});
    });
    (balance.groupLimits || []).forEach(function(limit) {
      if ((groupTotals[limit.key] || 0) > limit.max) violations.push(limit.label + ' : maximum ' + formatFr(limit.max, 0) + ' kg dépassé.');
    });
    const totalMass = rows.reduce(function(sum,row){ return sum + row.mass; },0);
    const totalMoment = rows.reduce(function(sum,row){ return sum + row.moment; },0);
    const cg = totalMoment / totalMass;
    const insideEnvelope = balance.momentEnvelope ? pointInEnvelope([totalMoment,totalMass], balance.momentEnvelope) : pointInEnvelope([cg,totalMass], balance.envelope);
    if (totalMass > balance.maxMass) violations.push('Masse maximale dépassée de ' + formatFr(totalMass - balance.maxMass, 1) + ' kg.');
    if (!insideEnvelope) violations.push('Point en dehors de l’enveloppe de centrage numérisée.');
    const safe = violations.length === 0;
    return {balance:balance, load:load, rows:rows, totalMass:totalMass, totalMoment:totalMoment, cg:cg, safe:safe, insideEnvelope:insideEnvelope, violations:violations, margin:balance.maxMass-totalMass};
  }

  function firstFinite() {
    for (let index = 0; index < arguments.length; index += 1) {
      const value = arguments[index];
      if (value !== null && value !== undefined && value !== '' && Number.isFinite(Number(value))) return Number(value);
    }
    return null;
  }

  function metarObservationQuality(metar, now) {
    const reference = Number.isFinite(now) ? now : Date.now();
    const timestamp = Date.parse(String(metar && (metar.observedAt || metar.timestamp) || ''));
    if (!Number.isFinite(timestamp)) return { status:'missing_time', ageSeconds:null, usable:false, label:'heure d\u2019observation absente' };
    const ageMs=reference-timestamp,ageSeconds = Math.floor(ageMs / 1000);
    if (ageMs < -5 * 60 * 1000) return { status:'future', ageSeconds:ageSeconds, usable:false, label:'horodatage futur incohérent' };
    if (ageMs > 2 * 60 * 60 * 1000) return { status:'old', ageSeconds:ageSeconds, usable:false, label:'observation de plus de 2 heures' };
    return { status:'current', ageSeconds:Math.max(0,ageSeconds), usable:true, label:'observation récente' };
  }

  function tafValidity(tafProduct, taf, now) {
    const reference = Number.isFinite(now) ? now : Date.now();
    if (!taf || !String(taf.raw || taf.rawTAF || '').trim()) return { status:'absent', label:'indisponible' };
    const raw=String(taf.raw||taf.rawTAF||'');
    if (/(?:^|\s)CNL(?=\s|$)/.test(raw)) return {status:'cancelled',label:'TAF annulé (CNL)'};
    if (/(?:^|\s)NIL(?=\s|$)/.test(raw)) return {status:'nil',label:'TAF NIL · prévision indisponible'};
    if (tafProduct && tafProduct.status === 'stale') return { status:'stale', label:'cache périmé' };
    const validFrom = Date.parse(String(taf.validFrom || ''));
    const validTo = Date.parse(String(taf.validTo || ''));
    if (!Number.isFinite(validFrom) || !Number.isFinite(validTo) || validTo <= validFrom) return { status:'unverified', label:'période de validité non vérifiable' };
    if (reference < validFrom) return { status:'future', label:'pas encore valide' };
    if (reference > validTo) return { status:'expired', label:'période de validité expirée' };
    return { status:'current', label:'dans sa période de validité' };
  }

  function shortUtc(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return date.toLocaleString('fr-FR',{timeZone:'UTC',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' UTC';
  }

  function normalizeSurfaceValue(value) {
    if (value === 'hard_dry') return 'hard';
    if (value === 'grass_dry') return 'grass';
    if (value === 'hard_wet' || value === 'grass_wet') return value;
    if (value === 'unsupported') return 'hard_wet';
    return value;
  }

  function surfaceFamily(value) {
    const normalized = normalizeSurfaceValue(value);
    if (normalized === 'hard' || normalized === 'hard_wet') return 'hard';
    if (normalized === 'grass' || normalized === 'grass_wet') return 'grass';
    return null;
  }

  function surfaceIsDryAndSupported(value) {
    const normalized = normalizeSurfaceValue(value);
    return normalized === 'hard' || normalized === 'grass';
  }

  function airfieldSurfaceFamilies(record) {
    const values = [];
    if (record && Array.isArray(record.surfaces)) values.push.apply(values, record.surfaces);
    if (record && Array.isArray(record.runways)) record.runways.forEach(function(runway) {
      if (Array.isArray(runway.availableSurfaces)) values.push.apply(values, runway.availableSurfaces);
      else if (runway.surface) values.push(runway.surface);
    });
    const families = new Set(values.map(surfaceFamily).filter(Boolean));
    return Array.from(families);
  }

  function defaultDrySurface(record, runway) {
    const runwayFamilies = runway ? airfieldSurfaceFamilies({runways:[runway]}) : [];
    if (runwayFamilies.includes('hard')) return 'hard';
    if (runwayFamilies.includes('grass')) return 'grass';
    if (runway && (runway.surface || (Array.isArray(runway.availableSurfaces) && runway.availableSurfaces.length))) return 'unknown';
    const families = airfieldSurfaceFamilies(record);
    if (families.includes('hard')) return 'hard';
    if (families.includes('grass')) return 'grass';
    return 'unknown';
  }

  function availableSurfaceOptions(record) {
    const families = airfieldSurfaceFamilies(record);
    const hasPublishedSurface = Boolean(record && ((Array.isArray(record.surfaces) && record.surfaces.length) || (Array.isArray(record.runways) && record.runways.some(function(runway){ return Boolean(runway.surface) || (Array.isArray(runway.availableSurfaces) && runway.availableSurfaces.length); }))));
    const selectedFamilies = families.length ? families : (hasPublishedSurface ? [] : ['hard','grass']);
    const options = [];
    if (selectedFamilies.includes('hard')) {
      options.push({value:'hard',label:'Dur sec'});
      options.push({value:'hard_wet',label:'Dur mouillé'});
    }
    if (selectedFamilies.includes('grass')) {
      options.push({value:'grass',label:'Herbe sèche'});
      options.push({value:'grass_wet',label:'Herbe mouillée'});
    }
    return options;
  }

  function selectedPublishedRunway() {
    const record=state.airfield.record;
    if(!record||!Array.isArray(record.runways))return null;
    return record.runways.find(function(runway){return runway.id===state.departure.runwayId;})||null;
  }

  function runwayHeadingDegrees(runway) {
    if (!runway) return null;
    const published = firstFinite(runway.trueHeadingDeg, runway.headingDeg, runway.bearingDeg, runway.magneticHeadingDeg);
    if (published !== null) return ((published % 360) + 360) % 360;
    const match = String(runway.id || runway.label || '').match(/^(\d{2})/);
    if (!match) return null;
    const qfu = Number(match[1]);
    if (qfu < 1 || qfu > 36) return null;
    return qfu === 36 ? 360 : qfu * 10;
  }

  function angularDifferenceDegrees(first, second) {
    return Math.abs((((first - second) % 360) + 540) % 360 - 180);
  }

  function windDirectionsInSector(fromDeg, toDeg) {
    if (!Number.isFinite(fromDeg) || !Number.isFinite(toDeg)) return [];
    const result=[];
    let span=((toDeg-fromDeg)%360+360)%360;
    if(span>180)span=360-span;
    const direction=(((toDeg-fromDeg)%360+360)%360)<=180?1:-1;
    for(let offset=0;offset<=span;offset+=1)result.push((fromDeg+direction*offset+360)%360);
    return result;
  }

  function longitudinalWindComponent(direction, speed, runwayHeading) {
    if (![direction,speed,runwayHeading].every(Number.isFinite)) return null;
    return speed*Math.cos(angularDifferenceDegrees(direction,runwayHeading)*Math.PI/180);
  }

  function roundedWindComponent(value) {
    return Math.round(value*10)/10;
  }

  function windComponentPhrase(value) {
    const rounded=roundedWindComponent(value);
    if(Math.abs(rounded)<0.05)return '0 kt';
    return formatFr(Math.abs(rounded),1)+' kt '+(rounded>0?'de face':'arrière');
  }

  function metarWindAnalysis(weather, runway) {
    const speed=firstFinite(weather&&weather.windSpeedKt);
    const direction=firstFinite(weather&&weather.windDirectionDeg);
    const runwayHeading=runwayHeadingDegrees(runway);
    if(speed===0&&Number.isFinite(runwayHeading))return {value:0,mean:0,minimum:0,maximum:0,crossesZero:false,note:'Vent calme dans le METAR.'};
    if(speed===null||direction===null||!Number.isFinite(runwayHeading))return null;
    const gust=firstFinite(weather&&weather.windGustKt);
    const sector=windDirectionsInSector(firstFinite(weather&&weather.windVariableFromDeg),firstFinite(weather&&weather.windVariableToDeg));
    const mean=longitudinalWindComponent(direction,speed,runwayHeading);
    const sectorComponents=(sector.length?sector:[direction]).map(function(candidateDirection){return longitudinalWindComponent(candidateDirection,speed,runwayHeading);});
    const minimum=Math.min.apply(null,sectorComponents),maximum=Math.max.apply(null,sectorComponents);
    const crossesZero=sector.length>0&&minimum<0&&maximum>0;
    const value=crossesZero?0:mean;
    const gustComponent=gust!==null&&gust>=speed?longitudinalWindComponent(direction,gust,runwayHeading):null;
    const qfuLabel=String(runway.id||'').trim()||formatFr(runwayHeading/10,0);
    const headingNote=Number.isFinite(firstFinite(runway.trueHeadingDeg,runway.headingDeg,runway.bearingDeg))?'relèvement publié':'QFU arrondi utilisé comme approximation';
    const note=crossesZero?'La variation du vent peut donner du vent de face ou arrière : 0 kt retenu par défaut, à confirmer ou ajuster.':'Composante du vent moyen METAR pour le QFU '+qfuLabel+' ('+headingNote+').';
    return {value:roundedWindComponent(value),mean:roundedWindComponent(mean),minimum:roundedWindComponent(minimum),maximum:roundedWindComponent(maximum),crossesZero:crossesZero,gustComponent:gustComponent===null?null:roundedWindComponent(gustComponent),direction:direction,speed:speed,gust:gust,sectorFrom:firstFinite(weather&&weather.windVariableFromDeg),sectorTo:firstFinite(weather&&weather.windVariableToDeg),qfu:qfuLabel,headingNote:headingNote,note:note};
  }

  function conservativeMetarWindComponent(weather, runway) {
    return metarWindAnalysis(weather,runway);
  }

  function recommendedRunwayFromWeather(record, weather) {
    if(!record||!Array.isArray(record.runways))return null;
    const direction=firstFinite(weather&&weather.windDirectionDeg),speed=firstFinite(weather&&weather.windSpeedKt);
    if(direction===null||speed===null||speed<=0)return null;
    const candidates=record.runways.map(function(runway){
      const heading=runwayHeadingDegrees(runway);
      return {runway:runway,heading:heading,component:longitudinalWindComponent(direction,speed,heading)};
    }).filter(function(candidate){return Number.isFinite(candidate.component);});
    if(!candidates.length)return null;
    candidates.sort(function(first,second){
      if(Math.abs(second.component-first.component)>0.001)return second.component-first.component;
      const firstHard=surfaceFamily(first.runway.surface)==='hard'?1:0,secondHard=surfaceFamily(second.runway.surface)==='hard'?1:0;
      if(secondHard!==firstHard)return secondHard-firstHard;
      return (firstFinite(second.runway.toraM)||0)-(firstFinite(first.runway.toraM)||0);
    });
    const best=candidates[0];
    const alternative=candidates.find(function(candidate){return angularDifferenceDegrees(candidate.heading,best.heading)>5;});
    if(alternative&&Math.abs(best.component-alternative.component)<0.1)return null;
    const station=String(weather&&weather.station||record.icao||'').toUpperCase();
    return {runway:best.runway,component:roundedWindComponent(best.component),note:'Piste '+String(best.runway.id)+' proposée d’après le vent moyen du METAR '+station+' : '+String(Math.round(direction)).padStart(3,'0')+'° / '+formatFr(speed,0)+' kt ('+windComponentPhrase(best.component)+'). À confirmer selon la piste en service, la VAC et les NOTAM.'};
  }

  function resetWindToDefault(note) {
    state.departure.windComponent=0;
    state.departure.windSource='default';
    state.departure.windNote=note||'0 kt par défaut à ajuster.';
  }

  function updateWindComponentFromWeather() {
    if(state.departure.windMode!=='metar')return;
    const computed=metarWindAnalysis(state.weather,selectedPublishedRunway());
    if(!computed){
      resetWindToDefault('Composante non calculable depuis le METAR et le QFU : 0 kt proposé par défaut, à ajuster.');
      return;
    }
    state.departure.windComponent=computed.value;
    state.departure.windSource='metar';
    state.departure.windNote=computed.note;
  }

  function selectPublishedRunway(runwayId, selectionSource, selectionNote) {
    const record = state.airfield.record;
    if (!record || !Array.isArray(record.runways)) return;
    const runway = record.runways.find(function(candidate){ return candidate.id === runwayId; });

    if (!runway) return;

    else if (publishedTora !== null) { state.departure.toda = publishedTora; state.departure.todaDerived=true; }
    state.departure.surface = defaultDrySurface(record,runway);
    const slopePublished=runway.slopePercent !== '' && runway.slopePercent !== null && runway.slopePercent !== undefined && Number.isFinite(Number(runway.slopePercent));

      const payload = await response.json();
      const records = Array.isArray(payload) ? payload : payload.airfields;
      record = Array.isArray(records) ? records.find(function(candidate){ return String(candidate.icao || '').toUpperCase() === requestedIcao; }) : null;
      if (String(state.departure.icao).toUpperCase() !== requestedIcao) return;
      if (record) {

        const publishedElevation=firstFinite(record.elevationFt);

        if (runwayStillExists) selectPublishedRunway(state.departure.runwayId);

      }
    } catch (_) {
      if (String(state.departure.icao).toUpperCase() !== requestedIcao) return;
      state.airfield = { status:'error', message:'Jeu terrain indisponible : conserver une saisie manuelle contrôlée sur la VAC.', record:null, cycle:'' };
    }

    const weatherStation = record && /^[A-Z]{4}$/.test(String(record.metarStation || '')) ? String(record.metarStation).toUpperCase() : requestedIcao;
    try {
      const response = await fetch('/api/weather?icao=' + encodeURIComponent(weatherStation), { headers:{ Accept:'application/json' } });
      const payload = await response.json().catch(function(){ return {}; });
      const payloadError = payload && payload.error && payload.error.message ? payload.error.message : null;
      if (!response.ok) throw new Error(payloadError || ('service météo HTTP ' + response.status));
      if (String(state.departure.icao).toUpperCase() !== requestedIcao) return;
      const metarProduct = payload.metar || {};
      const tafProduct = payload.taf || {};
      const metar = metarProduct.data || {};
      const taf = tafProduct.data || {};
      const temperature = firstFinite(metar.temperatureC, metar.temperature, metar.temp);
      const dewPoint = firstFinite(metar.dewpointC, metar.dewPointC, metar.dewPoint, metar.dewp);
      const qnh = firstFinite(metar.qnhHpa, metar.qnh, metar.altimeterHpa, metar.altim);
      const observation = metarObservationQuality(metar);
      const returnedStation = String(metar.station || '').toUpperCase();
      const stationExact = returnedStation === weatherStation;
      const serverReportCurrent = !metar.reportStatus || metar.reportStatus === 'current';
      const tafState = tafValidity(tafProduct,taf);
      const weatherDetails = {
        station:weatherStation,
        rawMetar:String(metar.raw||metar.rawOb||''),
        rawTaf:String(taf.raw||taf.rawTAF||''),
        observedAt:String(metar.observedAt||metar.timestamp||''),
        metarAgeSeconds:Number.isFinite(Number(metar.reportAgeSeconds))?Number(metar.reportAgeSeconds):observation.ageSeconds,
        metarReportStatus:serverReportCurrent?observation.status:String(metar.reportStatus),
        tafRelayStatus:String(tafProduct.status||''),

        ,windDirectionDeg:firstFinite(metar.windDirectionDeg),

      };
      if (temperature === null || qnh === null || !observation.usable || !serverReportCurrent || !stationExact) {
        const reason = !stationExact ? 'station retournée différente de la station demandée' : !observation.usable || !serverReportCurrent ? 'heure du METAR absente, incohérente ou observation de plus de 2 heures' : 'METAR sans température ou QNH exploitable';
        state.departure.qnh='';state.departure.temperature='';state.departure.dewPoint='';resetWindToDefault();state.departure.conditionsConfirmed=false;state.departure.conditionsConfirmedAt='';state.departure.conditionsSource='';state.departure.conditionsObservedAt='';
        state.weather=Object.assign({status:'partial',message:reason+' : aucune valeur météo n’est préremplie ; saisie manuelle et vérification requises.'},weatherDetails);
        persist();render();return;
      }
      state.departure.temperature = temperature;
      state.departure.dewPoint = dewPoint === null ? '' : dewPoint;
      state.departure.qnh = qnh;
      state.departure.conditionsConfirmed = false;

      state.departure.conditionsSource = 'metar';
      state.departure.conditionsObservedAt = String(metar.observedAt||metar.timestamp||'');
      state.weather = Object.assign({status:metarProduct.status==='stale'?'stale':'loaded',message:metarProduct.warning&&metarProduct.warning.message?metarProduct.warning.message:''},weatherDetails);
      const runwayRecommendation=recommendedRunwayFromWeather(record,state.weather);
      if(runwayRecommendation)selectPublishedRunway(runwayRecommendation.runway.id,'metar',runwayRecommendation.note);

      state.departure.qnh='';state.departure.temperature='';state.departure.dewPoint='';resetWindToDefault();state.departure.conditionsConfirmed=false;state.departure.conditionsConfirmedAt='';state.departure.conditionsSource='';state.departure.conditionsObservedAt='';
    }
