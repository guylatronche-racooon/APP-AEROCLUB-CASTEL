  }

  let confirmationExpiryTimer = null;

  function scheduleConfirmationExpiry() {
    if (confirmationExpiryTimer !== null && typeof clearTimeout === 'function') clearTimeout(confirmationExpiryTimer);
    confirmationExpiryTimer = null;
    if (typeof setTimeout !== 'function') return;
    const now=Date.now(),deadlines=[];
    if(state.departure.loadConfirmed){
      if(!confirmationTimestampCurrent(state.departure.loadConfirmedAt,now)){state.departure.loadConfirmed='';state.departure.loadConfirmedAt='';persist();}
      else deadlines.push((typeof state.departure.loadConfirmedAt==='number'?state.departure.loadConfirmedAt:Date.parse(String(state.departure.loadConfirmedAt)))+CONDITIONS_CONFIRMATION_MAX_AGE_MS);
    }
    if(state.departure.runwayConfirmed){
      if(!confirmationTimestampCurrent(state.departure.runwayConfirmedAt,now)){state.departure.runwayConfirmed=false;state.departure.runwayConfirmedAt='';persist();}
      else deadlines.push((typeof state.departure.runwayConfirmedAt==='number'?state.departure.runwayConfirmedAt:Date.parse(String(state.departure.runwayConfirmedAt)))+CONDITIONS_CONFIRMATION_MAX_AGE_MS);
    }
    if (state.departure.conditionsConfirmed) {
      if (!conditionsConfirmationCurrent(state.departure,now)) {
        state.departure.conditionsConfirmed=false;
        state.departure.conditionsConfirmedAt='';
        persist();
      } else {
        const raw=state.departure.conditionsConfirmedAt;
        const confirmedAt=typeof raw==='number'?raw:Date.parse(String(raw||''));
        if(Number.isFinite(confirmedAt))deadlines.push(confirmedAt+CONDITIONS_CONFIRMATION_MAX_AGE_MS);
        if(state.departure.conditionsSource==='metar'){
          const sourceObservation=Date.parse(String(state.departure.conditionsObservedAt||''));
          if(Number.isFinite(sourceObservation))deadlines.push(sourceObservation+2*60*60*1000);
        }
      }
    }

    if(state.screen==='performance'){
      const observedAt=Date.parse(String(state.weather.observedAt||''));
      if(Number.isFinite(observedAt)&&observedAt+2*60*60*1000>now){
        deadlines.push(observedAt+2*60*60*1000);
        deadlines.push(now+(60-(Math.floor((now-observedAt)/1000)%60))*1000);
      }
      const tafFrom=Date.parse(String(state.weather.tafValidFrom||'')),tafTo=Date.parse(String(state.weather.tafValidTo||''));
      if(Number.isFinite(tafFrom)&&tafFrom>now)deadlines.push(tafFrom);
      if(Number.isFinite(tafTo)&&tafTo>now)deadlines.push(tafTo);
    }

    const futureDeadlines=deadlines.filter(function(value){return Number.isFinite(value)&&value>now;});
    if(!futureDeadlines.length)return;
    const delay=Math.max(50,Math.min.apply(null,futureDeadlines)-now+50);
    confirmationExpiryTimer=setTimeout(function(){render();},delay);
  }

  function render() {
    const app=document.getElementById('app');
    let view=state.screen==='home'?homeView():state.screen==='aircraft'?aircraftView():state.screen==='balance'?balanceView():state.screen==='performance'?performanceView():state.screen==='bases'?calculationBasesView():state.screen==='density'?densityAltitudeView():checklistView();
    app.innerHTML=view+factsOverlay()+phasesOverlay()+disclaimer();
    document.documentElement.style.background=state.night?'#071219':'#eef3f5';
    scheduleConfirmationExpiry();
  }

        if(nextIcao!==state.departure.icao){
          state.airfield={status:'idle',message:'',record:null,cycle:''};state.weather={status:'idle',message:'',rawMetar:'',rawTaf:'',observedAt:'',windDirectionDeg:null,windSpeedKt:null,windGustKt:null,windVariableFromDeg:null,windVariableToDeg:null};
          Object.assign(state.departure,{elevation:'',qnh:'',temperature:'',dewPoint:'',windComponent:0,windMode:'metar',windSource:'default',windNote:'0 kt par défaut à ajuster.',tora:'',toda:'',todaDerived:false,surface:'unknown',slope:0,slopeSource:'default',runwayId:'',runwaySelectionSource:'',runwaySelectionNote:'',conditionsConfirmed:false,conditionsConfirmedAt:'',conditionsSource:'',conditionsObservedAt:'',runwayConfirmed:false,runwayConfirmedAt:''});
        }
        state.departure[key]=nextIcao;
      }
      else if(departureInput.tagName==='SELECT') {
        state.departure[key]=key==='surface'?normalizeSurfaceValue(departureInput.value):departureInput.value;
        if(key==='windMode'){
          if(state.departure.windMode==='metar')updateWindComponentFromWeather();
          else {state.departure.windSource='manual';state.departure.windNote='Valeur ajustable manuellement par le pilote.';}
        }
      }
      else {
        const raw=String(departureInput.value).trim();
        const parsed=raw===''?'':Number(raw.replace(',','.'));
        setDepartureNumericValue(key,Number.isFinite(parsed)?parsed:'');
        if(key==='windComponent'){
          state.departure.windMode='manual';
          state.departure.windSource='manual';
          state.departure.windNote='Valeur saisie manuellement par le pilote.';
        }
        if(key==='slope')state.departure.slopeSource='manual';
      }
      invalidateConditionsAfterEdit(key);
      if(['elevation','tora','toda','surface','slope','safetyMarginPercent'].includes(key)){state.departure.runwayConfirmed=false;state.departure.runwayConfirmedAt='';}
      persist(); render();
      const replacement=document.querySelector('[data-departure="'+key+'"]');
      if(replacement){replacement.focus();}
      return;
    }
    const runwayInput=event.target.closest('[data-runway]');
    if(runwayInput){selectPublishedRunway(runwayInput.value);persist();render();return;}
    const input=event.target.closest('[data-load]');
    if(!input)return;
    const raw=String(input.value).trim(), parsed=raw===''?'':Number(raw.replace(',','.')), value=Number.isFinite(parsed)?parsed:'', aircraft=currentAircraft();
    state.loads[aircraft.id]=Object.assign({},defaultLoad(aircraft.balance),state.loads[aircraft.id]||{});
    state.loads[aircraft.id][input.dataset.load]=value;
    state.departure.loadConfirmed='';
    state.departure.loadConfirmedAt='';
    persist();
    render();
    const replacement=document.querySelector('[data-load="'+input.dataset.load+'"]');
    if(replacement){replacement.focus();}
  });

  document.addEventListener('visibilitychange',function(){if(!document.hidden)render();});
  if(typeof globalThis.addEventListener==='function')globalThis.addEventListener('focus',function(){render();});

  if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(function(){});}
  render();
  </script>
</body>
</html>
